<svg viewBox="0 0 700 428" role="img" aria-label="Which lane? A decision tree for each kind of question">
<title>Which lane?</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker></defs>
<g class="t" style="font-size:13.5px">
<rect x="8" y="8" width="280" height="70" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/>
<text x="22" y="31" style="fill:var(--ink);font-weight:600">Is it a why-question?</text>
<text x="22" y="50" style="fill:var(--muted);font-size:12.5px">explains a movement rather than</text>
<text x="22" y="66" style="fill:var(--muted);font-size:12.5px">states a number</text>
<path d="M288 43 L382 43" style="fill:none;stroke:var(--muted);stroke-width:1.4" marker-end="url(#arr)"/><text x="335" y="36" text-anchor="middle" class="m" style="font-size:12px;fill:var(--muted)">YES</text>
<rect x="386" y="8" width="306" height="70" rx="7" style="fill:var(--panel);stroke:var(--line-2);stroke-width:1.3"/>
<text x="400" y="35" style="fill:var(--ink);font-weight:600">Deferred until the what is released</text>
<text x="400" y="55" style="fill:var(--muted);font-size:12.5px">then the ontology and dated changes</text>
<path d="M148 78 L148 100" style="fill:none;stroke:var(--muted);stroke-width:1.4" marker-end="url(#arr)"/><text x="158" y="95" class="m" style="font-size:12px;fill:var(--muted)">NO</text>
<rect x="8" y="104" width="280" height="88" rx="7" style="fill:var(--bg);stroke:var(--accent);stroke-width:1.8"/>
<text x="22" y="127" style="fill:var(--ink);font-weight:600">If the answer is wrong and nobody</text>
<text x="22" y="144" style="fill:var(--ink);font-weight:600">notices, where does it land?</text>
<text x="22" y="164" style="fill:var(--muted);font-size:12.5px">ask it of the kind of question,</text>
<text x="22" y="180" style="fill:var(--muted);font-size:12.5px">not one question</text>
<path d="M288 148 L382 148" style="fill:none;stroke:var(--muted);stroke-width:1.4" marker-end="url(#arr)"/>
<text x="300" y="124" class="m" style="font-size:12px;fill:var(--muted)">BOARD PACK,</text>
<text x="300" y="139" class="m" style="font-size:12px;fill:var(--muted)">CLOSE, KPI</text>
<rect x="386" y="96" width="306" height="106" rx="7" style="fill:var(--tint);stroke:var(--accent);stroke-width:1.5"/>
<text x="400" y="117" class="m" style="font-size:12px;fill:var(--accent);letter-spacing:.06em">GOVERNED LANE</text>
<text x="400" y="137" style="fill:var(--ink);font-weight:600">Exact, every time.</text>
<text x="400" y="154" style="fill:var(--ink);font-weight:600">Metric or no answer.</text>
<text x="400" y="174" style="fill:var(--text);font-size:12.5px">nobody reads the SQL before acting</text>
<text x="400" y="190" style="fill:var(--text);font-size:12.5px">the pipeline question, $412M</text>
<path d="M288 180 H298 V266 H382" style="fill:none;stroke:var(--muted);stroke-width:1.4" marker-end="url(#arr)"/>
<text x="306" y="228" class="m" style="font-size:12px;fill:var(--muted)">WHERE TO</text>
<text x="306" y="243" class="m" style="font-size:12px;fill:var(--muted)">LOOK NEXT</text>
<rect x="386" y="214" width="306" height="104" rx="7" style="fill:var(--bg);stroke:var(--accent);stroke-width:1.5"/>
<text x="400" y="235" class="m" style="font-size:12px;fill:var(--accent);letter-spacing:.06em">EXPLORATORY LANE</text>
<text x="400" y="255" style="fill:var(--ink);font-weight:600">Points the right way.</text>
<text x="400" y="272" style="fill:var(--ink);font-weight:600">SQL and sources shown.</text>
<text x="400" y="292" style="fill:var(--text);font-size:12.5px">a reader checks the SQL before acting</text>
<text x="400" y="308" style="fill:var(--text);font-size:12.5px">slipped deals: 96</text>
<path d="M148 192 L148 326" style="fill:none;stroke:var(--muted);stroke-width:1.4" marker-end="url(#arr)"/><text x="158" y="256" class="m" style="font-size:12px;fill:var(--muted)">LATER, IN</text><text x="158" y="271" class="m" style="font-size:12px;fill:var(--muted)">PRODUCTION</text>
<rect x="8" y="332" width="280" height="88" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/>
<text x="22" y="355" style="fill:var(--ink);font-weight:600">Do two people publish different</text>
<text x="22" y="372" style="fill:var(--ink);font-weight:600">numbers for it?</text>
<text x="22" y="392" style="fill:var(--muted);font-size:12.5px">seed disagreement or a user</text>
<text x="22" y="408" style="fill:var(--muted);font-size:12.5px">correction shows it</text>
<path d="M288 376 L382 376" style="fill:none;stroke:var(--muted);stroke-width:1.4" marker-end="url(#arr)"/><text x="335" y="369" text-anchor="middle" class="m" style="font-size:12px;fill:var(--muted)">YES</text>
<rect x="386" y="332" width="306" height="88" rx="7" style="fill:var(--tint);stroke:var(--accent);stroke-width:1.5"/>
<text x="400" y="366" style="fill:var(--ink);font-weight:600">It has become governed.</text>
<text x="400" y="386" style="fill:var(--text);font-size:12.5px">write its metric, resolve the conflict,</text>
<text x="400" y="402" style="fill:var(--text);font-size:12.5px">move it</text>
</g>
</svg>
