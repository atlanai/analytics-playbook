<g style="fill:var(--accent)">
<polygon points="0,-6 10,0 0,6" transform="translate(576.0,106.9) rotate(21.5)"/>
<polygon points="0,-6 10,0 0,6" transform="translate(712.0,268.0) rotate(90.0)"/>
<polygon points="0,-6 10,0 0,6" transform="translate(576.0,429.1) rotate(158.5)"/>
<polygon points="0,-6 10,0 0,6" transform="translate(304.0,429.1) rotate(-158.5)"/>
<polygon points="0,-6 10,0 0,6" transform="translate(168.0,268.0) rotate(-90.0)"/>
<polygon points="0,-6 10,0 0,6" transform="translate(304.0,106.9) rotate(-21.5)"/>
</g>
<a href="#domain-two" class="lc-spur"><text x="288" y="76" text-anchor="end" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.06em">↻ NEXT DOMAIN</text><text x="288" y="93" text-anchor="end" class="t" style="font-size:12.5px;fill:var(--muted)">starts from what this</text><text x="288" y="109" text-anchor="end" class="t" style="font-size:12.5px;fill:var(--muted)">one built</text></a>
<a href="#ch-evals" class="lc-core"><circle cx="440" cy="268" r="84" style="fill:var(--tint);stroke:var(--accent);stroke-width:1.5"/><text x="440" y="252" text-anchor="middle" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.08em">AT THE CENTRE</text><text x="440" y="274" text-anchor="middle" class="t" style="font-size:17px;font-weight:600;fill:var(--ink)">The golden set</text><text x="440" y="294" text-anchor="middle" class="t" style="font-size:12.5px;fill:var(--text)">every stage is scored</text><text x="440" y="310" text-anchor="middle" class="t" style="font-size:12.5px;fill:var(--text)">against it</text></a>
<a href="#ch03" class="lc-node"><rect x="322" y="42" width="236" height="80" rx="8" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="338" y="66" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">PHASE 0 · SCOPE</text><text x="338" y="88" class="t" style="font-size:15.5px;font-weight:600;fill:var(--ink)">Before the clock</text><text x="338" y="107" class="t" style="font-size:12.5px;fill:var(--muted)">Owners, brief, access proved</text><text x="544" y="67" text-anchor="end" class="t lc-go" style="font-size:15px;fill:var(--accent)">→</text></a>
<a href="#ch04" class="lc-node"><rect x="564" y="135" width="230" height="80" rx="8" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="578" y="159" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">PHASE 1 · WRITE THE TESTS</text><text x="578" y="181" class="t" style="font-size:15.5px;font-weight:600;fill:var(--ink)">Build the golden set</text><text x="578" y="200" class="t" style="font-size:12.5px;fill:var(--muted)">Real questions, verified answers</text><text x="780" y="160" text-anchor="end" class="t lc-go" style="font-size:15px;fill:var(--accent)">→</text></a>
<a href="#ch05" class="lc-node"><rect x="564" y="321" width="230" height="80" rx="8" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="578" y="345" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">PHASE 2 · BUILD</text><text x="578" y="367" class="t" style="font-size:15.5px;font-weight:600;fill:var(--ink)">Generate metrics</text><text x="578" y="386" class="t" style="font-size:12.5px;fill:var(--muted)">Business rules written as SQL</text><text x="780" y="346" text-anchor="end" class="t lc-go" style="font-size:15px;fill:var(--accent)">→</text></a>
<a href="#ch06" class="lc-node"><rect x="322" y="414" width="236" height="80" rx="8" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="338" y="438" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">PHASE 3 · DEBUG</text><text x="338" y="460" class="t" style="font-size:15.5px;font-weight:600;fill:var(--ink)">Hill-climb from traces</text><text x="338" y="479" class="t" style="font-size:12.5px;fill:var(--muted)">Read the trace of every miss</text><text x="544" y="439" text-anchor="end" class="t lc-go" style="font-size:15px;fill:var(--accent)">→</text></a>
<a href="#ch07" class="lc-node"><rect x="86" y="321" width="230" height="80" rx="8" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="100" y="345" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">PHASE 4 · RELEASE</text><text x="100" y="367" class="t" style="font-size:15.5px;font-weight:600;fill:var(--ink)">Release and hand over</text><text x="100" y="386" class="t" style="font-size:12.5px;fill:var(--muted)">Unseen questions, a solo pass</text><text x="302" y="346" text-anchor="end" class="t lc-go" style="font-size:15px;fill:var(--accent)">→</text></a>
<a href="#ch-run" class="lc-node"><rect x="86" y="135" width="230" height="80" rx="8" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="100" y="159" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">AFTER LAUNCH · OPERATE</text><text x="100" y="181" class="t" style="font-size:15.5px;font-weight:600;fill:var(--ink)">Keep it running</text><text x="100" y="200" class="t" style="font-size:12.5px;fill:var(--muted)">Real usage in, drift caught</text><text x="302" y="160" text-anchor="end" class="t lc-go" style="font-size:15px;fill:var(--accent)">→</text></a>
</svg>
