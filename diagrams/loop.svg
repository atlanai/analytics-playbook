<svg viewBox="0 0 640 430" role="img" aria-label="The loop: scope, test, generate metrics, resolve conflicts, hill climb, release, and back">
<title>The loop</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--accent)"/></marker></defs>
<!-- ring -->
<circle cx="320" cy="215" r="132" style="fill:none;stroke:var(--line-2);stroke-width:1.5;stroke-dasharray:3 4"/>
<!-- clockwise arrowheads between nodes -->
<g style="fill:var(--accent)">
  <polygon points="0,-5 8,0 0,5" transform="translate(434.3,149) rotate(120)"/>
  <polygon points="0,-5 8,0 0,5" transform="translate(320,347) rotate(180)"/>
  <polygon points="0,-5 8,0 0,5" transform="translate(205.7,281) rotate(240)"/>
  <polygon points="0,-5 8,0 0,5" transform="translate(205.7,149) rotate(300)"/>
  <polygon points="0,-5 8,0 0,5" transform="translate(320,83) rotate(0)"/>
  <polygon points="0,-5 8,0 0,5" transform="translate(434.3,281) rotate(60)"/>
</g>
<!-- nodes: (cx,cy) -->
<g class="t" style="font-size:13px">
  <g><rect x="245" y="56" width="150" height="54" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="320" y="79" text-anchor="middle" style="fill:var(--ink);font-weight:600">Scope one domain</text><text x="320" y="97" text-anchor="middle" class="m" style="font-size:10.5px;fill:var(--accent)">PHASE 0</text></g>
  <g><rect x="336" y="122" width="196" height="54" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="434" y="145" text-anchor="middle" style="fill:var(--ink);font-weight:600">Test against the golden set</text><text x="434" y="163" text-anchor="middle" class="m" style="font-size:10.5px;fill:var(--accent)">PHASE 1</text></g>
  <g><rect x="359" y="254" width="150" height="54" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="434" y="277" text-anchor="middle" style="fill:var(--ink);font-weight:600">Generate metrics</text><text x="434" y="295" text-anchor="middle" class="m" style="font-size:10.5px;fill:var(--accent)">PHASE 2</text></g>
  <g><rect x="245" y="320" width="150" height="54" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="320" y="343" text-anchor="middle" style="fill:var(--ink);font-weight:600">Resolve conflicts</text><text x="320" y="361" text-anchor="middle" class="m" style="font-size:10.5px;fill:var(--accent)">PHASE 2</text></g>
  <g><rect x="131" y="254" width="150" height="54" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="206" y="277" text-anchor="middle" style="fill:var(--ink);font-weight:600">Hill climb from traces</text><text x="206" y="295" text-anchor="middle" class="m" style="font-size:10.5px;fill:var(--accent)">PHASE 3</text></g>
  <g><rect x="131" y="122" width="150" height="54" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="206" y="145" text-anchor="middle" style="fill:var(--ink);font-weight:600">Release</text><text x="206" y="163" text-anchor="middle" class="m" style="font-size:10.5px;fill:var(--accent)">PHASE 4</text></g>
</g>
<!-- return label on the arc release -> scope -->
<text x="160" y="66" text-anchor="middle" class="t" style="font-size:11px;fill:var(--muted)"><tspan x="160" dy="0">real traces and corrections</tspan><tspan x="160" dy="13">feed the next version ↻</tspan></text>
<!-- outward arrow: domain two inherits -->
<path d="M131 149 L118 149" style="fill:none;stroke:var(--accent);stroke-width:1.5" marker-end="url(#arr)"/>
<rect x="6" y="120" width="106" height="58" rx="7" style="fill:var(--tint);stroke:var(--accent);stroke-width:1.2"/>
<text x="59" y="139" text-anchor="middle" class="t" style="font-size:11.5px;fill:var(--ink);font-weight:600">Domain two</text>
<text x="59" y="153" text-anchor="middle" class="t" style="font-size:10.5px;fill:var(--text)">inherits what</text>
<text x="59" y="166" text-anchor="middle" class="t" style="font-size:10.5px;fill:var(--text)">domain one built</text>
<text x="59" y="190" text-anchor="middle" class="m" style="font-size:9.5px;fill:var(--accent)">AFTER PHASE 4</text>
<!-- centre -->
<text x="320" y="208" text-anchor="middle" class="d" style="font-size:15px;fill:var(--ink);font-weight:600">One domain,</text>
<text x="320" y="228" text-anchor="middle" class="d" style="font-size:15px;fill:var(--ink);font-weight:600">five phases</text>
<text x="320" y="410" text-anchor="middle" class="m" style="font-size:10.5px;fill:var(--muted)">EVALS COME FIRST · WHAT BEFORE WHY · ONE DOMAIN AT A TIME</text>
</svg>
