<svg viewBox="0 0 720 388" role="img" aria-label="Bare schema versus with past SQL, per model: GLM-5.2 31.8% to 70.1%, GPT-5.6 40.2% to 66.4%. Bare schema across five models sits between 31.8% and 42.1%.">
<title>Context moves every model more than switching models does</title>
