<svg style="font-family:var(--body)" viewBox="14 8 732 376" role="img" aria-label="Feedback that lands in the model stays deterministic; notes beside it do not" font-size="13"><defs><marker id="fb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--line-2)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--ink)">Feedback that lands in the model stays deterministic; notes beside it do not</text><rect x="24" y="56" width="344" height="312" rx="8" fill="none" stroke="var(--line-2)" stroke-width="1.25"></rect><text x="40" y="80" font-size="12" font-weight="600" fill="var(--muted)">FEEDBACK BESIDE THE MODEL</text><rect x="40" y="92" width="312" height="40" rx="8" fill="none" stroke="var(--line-2)" stroke-width="1.25"></rect><text x="196" y="117" text-anchor="middle" font-weight="600" fill="var(--ink)">Orders view</text><rect x="40" y="144" width="312" height="26" rx="6" fill="var(--warn)" fill-opacity="0.10" stroke="var(--warn)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="56" y="161" font-size="12" fill="var(--ink)">Verified query: revenue by week</text><rect x="40" y="176" width="312" height="26" rx="6" fill="var(--warn)" fill-opacity="0.10" stroke="var(--warn)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="56" y="193" font-size="12" fill="var(--ink)">Instruction: exclude test orders</text><rect x="40" y="208" width="312" height="26" rx="6" fill="var(--warn)" fill-opacity="0.10" stroke="var(--warn)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="56" y="225" font-size="12" fill="var(--ink)">Instruction: fiscal year starts in February</text><rect x="40" y="240" width="312" height="26" rx="6" fill="var(--warn)" fill-opacity="0.10" stroke="var(--warn)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="56" y="257" font-size="12" fill="var(--ink)">Verified query: revenue by region</text><rect x="40" y="272" width="312" height="26" rx="6" fill="var(--warn)" fill-opacity="0.10" stroke="var(--warn)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="56" y="289" font-size="12" fill="var(--muted)">...one more for every fix, in every view</text><text x="40" y="326" font-size="12" font-weight="600" fill="var(--warn)">The agent reinterprets this text on every question,</text><text x="40" y="344" font-size="12" font-weight="600" fill="var(--warn)">and the pile grows with each fix.</text><rect x="392" y="56" width="344" height="312" rx="8" fill="var(--accent)" fill-opacity="0.05" stroke="var(--accent)" stroke-width="2"></rect><text x="408" y="80" font-size="12" font-weight="600" fill="var(--muted)">FEEDBACK INTO THE MODEL</text><rect x="408" y="92" width="312" height="36" rx="18" fill="none" stroke="var(--line-2)" stroke-width="1.25"></rect><text x="564" y="115" text-anchor="middle" fill="var(--ink)">Feedback: exclude test orders</text><g fill="none" stroke="var(--line-2)" stroke-width="1.25"><path d="M564 128V150" marker-end="url(#fb-arrow)"></path><path d="M564 238V260" marker-end="url(#fb-arrow)"></path></g><rect x="408" y="152" width="312" height="86" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"></rect><text x="424" y="174" font-weight="600" fill="var(--ink)">Metric: order revenue</text><text x="424" y="194" font-size="12" font-family="var(--mono)" fill="var(--ink)">formula: SUM(amount)</text><text x="424" y="212" font-size="12" font-family="var(--mono)" fill="var(--ink)">filter: is_test = false</text><text x="704" y="212" text-anchor="end" font-size="12" font-weight="600" fill="var(--accent)">updated</text><text x="424" y="230" font-size="12" font-family="var(--mono)" fill="var(--ink)">calendar: fiscal, starts Feb</text><rect x="408" y="262" width="312" height="40" rx="8" fill="none" stroke="var(--ok)" stroke-width="1.25"></rect><text x="564" y="287" text-anchor="middle" fill="var(--ink)">Compiles to the same SQL every time</text><text x="408" y="326" font-size="12" fill="var(--ink)">One definition changes, and every question that</text><text x="408" y="344" font-size="12" fill="var(--ink)">uses the metric picks up the fix.</text></svg>