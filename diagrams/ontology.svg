<text x="34" y="451" style="fill:var(--muted);font-size:10.5px">tested in SQL: owner changed, no stage change since</text>
<rect x="366" y="398" width="344" height="58" rx="7" style="fill:var(--tint);stroke:var(--accent);stroke-width:1.5"/>
<text x="380" y="418" class="m" style="font-size:10.5px;fill:var(--accent);letter-spacing:.06em">SECOND CAUSE · OPPORTUNITY → STAGE HISTORY</text>
