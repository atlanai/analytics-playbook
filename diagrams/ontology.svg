<svg viewBox="12 4 706 458" role="img" aria-label="Ontology fragment for the EMEA question: five entities, five relationships, two dated changes, two tested paths">
<title>Ontology fragment for the EMEA question</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker></defs>
