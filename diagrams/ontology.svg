<text x="438" y="437" style="fill:var(--text);font-size:11.5px">9 deals re-signed, back to the first stage</text>
<text x="380" y="451" style="fill:var(--muted);font-size:10.5px">EMEA fell $53M ($214M → $161M); NA and APAC held</text>
