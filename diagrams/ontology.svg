<text x="635" y="123" text-anchor="middle" class="m" style="font-size:10.5px;fill:var(--muted)">crm.stage_history</text>
<rect x="60" y="262" width="150" height="58" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/>
