<text x="34" y="418" class="m" style="font-size:10.5px;fill:var(--accent);letter-spacing:.06em">FIRST CAUSE · TERRITORY → REP → OPPORTUNITY</text>
<text x="34" y="437" style="fill:var(--ink);font-weight:600;font-size:15px">$31M</text>
