<svg viewBox="0 0 704 492" role="img" aria-label="Domain two: Finance inherits what Sales built, builds its own, and shares two contested words with no arbiter yet">
<title>What domain two inherits</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker></defs>
<g class="t" style="font-size:12px">
  <rect x="8" y="32" width="208" height="168" rx="8" style="fill:var(--bg);stroke:var(--ink);stroke-width:2"/>
  <text x="20" y="53" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.06em">DOMAIN ONE · SALES</text>
  <text x="20" y="73" style="font-size:13.5px;fill:var(--ink);font-weight:600">Built in five phases</text>
  <text x="20" y="93" style="fill:var(--text)">owner: the RevOps lead</text>
  <text x="20" y="109" style="fill:var(--text)">the FP&amp;A partner has co-owned</text>
  <text x="20" y="125" style="fill:var(--text)">"Top accounts" since phase 3</text>
  <text x="20" y="147" style="fill:var(--text)">6 metrics, 5 rules,</text>
  <text x="20" y="163" style="fill:var(--text)">12 terms</text>
  <text x="20" y="189" class="m" style="font-size:11.5px;fill:var(--muted)">LAUNCHED AT PHASE 4</text>
</g>
<text x="352" y="20" text-anchor="middle" class="m" style="font-size:11.5px;letter-spacing:.06em;fill:var(--ink);font-weight:500">INHERITED AS IS</text>
<g class="t" style="font-size:12px">
  <rect x="232" y="32" width="240" height="26" rx="5" style="fill:var(--tint);stroke:var(--accent);stroke-width:1"/><text x="242" y="49" style="fill:var(--ink)">term "Top accounts"</text>
  <rect x="232" y="63" width="240" height="26" rx="5" style="fill:var(--tint);stroke:var(--accent);stroke-width:1"/><text x="242" y="80" style="fill:var(--ink)">rule quarter-means-fiscal</text>
  <rect x="232" y="94" width="240" height="26" rx="5" style="fill:var(--tint);stroke:var(--accent);stroke-width:1"/><text x="242" y="111" style="fill:var(--ink)">rule "early stages never count"</text>
  <rect x="232" y="125" width="240" height="26" rx="5" style="fill:var(--tint);stroke:var(--accent);stroke-width:1"/><text x="242" y="142" style="fill:var(--ink)">rule "internal and test accounts out"</text>
  <rect x="232" y="156" width="240" height="26" rx="5" style="fill:var(--tint);stroke:var(--accent);stroke-width:1"/><text x="242" y="173" style="fill:var(--ink)">entities Account, Opportunity</text>
  <rect x="232" y="187" width="240" height="26" rx="5" style="fill:var(--tint);stroke:var(--accent);stroke-width:1"/><text x="242" y="204" style="fill:var(--ink)">grading rubric v1</text>
  <rect x="232" y="218" width="240" height="26" rx="5" style="fill:var(--tint);stroke:var(--accent);stroke-width:1"/><text x="242" y="235" style="fill:var(--ink)">release process, rerun triggers</text>
</g>
<path d="M216 120 L230 120" style="fill:none;stroke:var(--muted);stroke-width:1.4"/>
<path d="M472 137 L486 137" style="fill:none;stroke:var(--muted);stroke-width:1.4" marker-end="url(#arr)"/>
<g class="t" style="font-size:12px">
  <rect x="488" y="32" width="208" height="230" rx="8" style="fill:var(--bg);stroke:var(--ink);stroke-width:2"/>
  <text x="500" y="53" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.06em">DOMAIN TWO · FINANCE</text>
  <text x="500" y="73" style="font-size:13.5px;fill:var(--ink);font-weight:600">Builds its own</text>
  <text x="500" y="93" style="fill:var(--text)">its own brief and access</text>
  <text x="500" y="109" style="fill:var(--text)">list; security approves the</text>
  <text x="500" y="125" style="fill:var(--text)">billing and ledger schemas</text>
  <text x="500" y="147" style="fill:var(--text)">a golden set of 20+</text>
  <text x="500" y="169" style="fill:var(--text)">metrics for bookings, net new</text>
  <text x="500" y="185" style="fill:var(--text)">ARR and churn ARR</text>
  <text x="500" y="207" style="fill:var(--text)">its own conflicts to resolve</text>
  <text x="500" y="241" class="m" style="font-size:11.5px;fill:var(--muted)">THE SAME FIVE PHASES</text>
</g>
<!-- shared words -->
<text x="8" y="284" class="m" style="font-size:11.5px;letter-spacing:.06em;fill:var(--ink);font-weight:500">WORDS BOTH DOMAINS USE</text>
<g class="t" style="font-size:12px">
  <rect x="8" y="296" width="218" height="66" rx="7" style="fill:var(--bg);stroke:var(--ok);stroke-width:1.5"/>
  <text x="18" y="316" class="m" style="font-size:11.5px;fill:var(--ok);letter-spacing:.04em">"QUARTER" · SETTLED</text>
  <text x="18" y="335" style="fill:var(--text)">fiscal, in both domains</text>
  <rect x="243" y="296" width="218" height="66" rx="7" style="fill:var(--bg);stroke:var(--stop);stroke-width:1.3"/>
  <text x="253" y="316" class="m" style="font-size:11.5px;fill:var(--stop);letter-spacing:.04em">"ARR" · CONTESTED</text>
  <text x="253" y="335" style="fill:var(--text)">Sales: the latest term's value</text>
  <text x="253" y="351" style="fill:var(--text)">Finance: recognised at period end</text>
  <rect x="478" y="296" width="218" height="66" rx="7" style="fill:var(--bg);stroke:var(--stop);stroke-width:1.3"/>
  <text x="488" y="316" class="m" style="font-size:11.5px;fill:var(--stop);letter-spacing:.04em">"CUSTOMER" · CONTESTED</text>
  <text x="488" y="335" style="fill:var(--text)">Sales: an active term</text>
  <text x="488" y="351" style="fill:var(--text)">Finance: a paid invoice</text>
</g>
<g style="fill:none;stroke:var(--stop);stroke-width:1.4">
  <path d="M352 362 L352 392" marker-end="url(#arr)"/>
  <path d="M587 362 L587 392" marker-end="url(#arr)"/>
</g>
<rect x="243" y="396" width="453" height="88" rx="8" style="fill:var(--bg);stroke:var(--stop);stroke-width:1.5;stroke-dasharray:6 4"/>
<text x="257" y="417" class="m" style="font-size:11.5px;fill:var(--stop);letter-spacing:.06em">MISSING · A CROSS-DOMAIN ARBITER</text>
<text x="257" y="437" class="t" style="font-size:13.5px;fill:var(--ink);font-weight:600">When the two owners disagree, nobody decides</text>
<text x="257" y="456" class="t" style="font-size:12px;fill:var(--text)">the sponsors name one before Finance's brief is agreed</text>
<text x="257" y="472" class="t" style="font-size:12px;fill:var(--text)">until then neither domain redefines "ARR" or "customer" alone</text>
<text x="8" y="400" class="m" style="font-size:11.5px;fill:var(--muted)"><tspan x="8" dy="0">EACH OWNER DECIDES FOR</tspan><tspan x="8" dy="16">THEIR OWN DOMAIN;</tspan><tspan x="8" dy="16">NEITHER OVER THE OTHER</tspan></text>
</svg>
