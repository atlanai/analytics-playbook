<svg viewBox="20 45 680 523" role="img" aria-label="One hill-climb round as a cycle of seven steps, with the stop rule as the exit">
<title>One round</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker></defs>
<ellipse cx="360" cy="236" rx="244" ry="170" style="fill:none;stroke:var(--line-2);stroke-width:1.5;stroke-dasharray:3 4"/>
<g style="fill:var(--accent)">
  <polygon points="0,-5 8,0 0,5" transform="translate(122.1,273.8) rotate(-108.1)"/>
  <polygon points="0,-5 8,0 0,5" transform="translate(169.2,130.0) rotate(-41.1)"/>
  <polygon points="0,-5 8,0 0,5" transform="translate(360.0,66.0) rotate(0.0)"/>
  <polygon points="0,-5 8,0 0,5" transform="translate(550.8,130.0) rotate(41.1)"/>
  <polygon points="0,-5 8,0 0,5" transform="translate(597.9,273.8) rotate(108.1)"/>
  <polygon points="0,-5 8,0 0,5" transform="translate(465.9,389.2) rotate(161.5)"/>
  <polygon points="0,-5 8,0 0,5" transform="translate(254.1,389.2) rotate(-161.5)"/>
</g>
<g class="t">
  <g><rect x="71" y="312" width="196" height="66" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="169" y="334" text-anchor="middle" style="font-size:13.5px;fill:var(--ink);font-weight:600">1 · Freeze</text><text x="169" y="352" text-anchor="middle" style="font-size:12px;fill:var(--text)">tag the layer version</text><text x="169" y="369" text-anchor="middle" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">CONTEXT ENGINEER</text></g>
  <g><rect x="24" y="168" width="196" height="66" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="122" y="190" text-anchor="middle" style="font-size:13.5px;fill:var(--ink);font-weight:600">2 · Predict</text><text x="122" y="208" text-anchor="middle" style="font-size:12px;fill:var(--text)">which items flip, which way</text><text x="122" y="225" text-anchor="middle" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">WRITTEN BEFORE THE RUN</text></g>
  <g><rect x="159" y="53" width="190" height="66" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="254" y="75" text-anchor="middle" style="font-size:13.5px;fill:var(--ink);font-weight:600">3 · Run</text><text x="254" y="93" text-anchor="middle" style="font-size:12px;fill:var(--text)">one run early; 3-5 past 60%</text><text x="254" y="110" text-anchor="middle" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">AGENT BUILDER</text></g>
  <g><rect x="371" y="53" width="190" height="66" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="466" y="75" text-anchor="middle" style="font-size:13.5px;fill:var(--ink);font-weight:600">4 · Grade</text><text x="466" y="93" text-anchor="middle" style="font-size:12px;fill:var(--text)">the data, then the SQL</text><text x="466" y="110" text-anchor="middle" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">EVAL OWNER</text></g>
  <g><rect x="500" y="168" width="196" height="66" rx="7" style="fill:var(--bg);stroke:var(--accent);stroke-width:1.5"/><text x="598" y="190" text-anchor="middle" style="font-size:13.5px;fill:var(--ink);font-weight:600">5 · Read and classify</text><text x="598" y="208" text-anchor="middle" style="font-size:12px;fill:var(--text)">raw trace; domain owner checks</text><text x="598" y="225" text-anchor="middle" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">CONTEXT ENGINEER</text></g>
  <g><rect x="453" y="312" width="196" height="66" rx="7" style="fill:var(--bg);stroke:var(--accent);stroke-width:1.5"/><text x="551" y="334" text-anchor="middle" style="font-size:13.5px;fill:var(--ink);font-weight:600">6 · Change and approve</text><text x="551" y="352" text-anchor="middle" style="font-size:12px;fill:var(--text)">the smallest change per miss</text><text x="551" y="369" text-anchor="middle" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">ITS OWNER APPROVES</text></g>
  <g><rect x="266" y="384" width="188" height="66" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/><text x="360" y="406" text-anchor="middle" style="font-size:13.5px;fill:var(--ink);font-weight:600">7 · Rerun and record</text><text x="360" y="424" text-anchor="middle" style="font-size:12px;fill:var(--text)">the whole set; a change-log row</text><text x="360" y="441" text-anchor="middle" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">FAILED PREDICTIONS TOO</text></g>
</g>
<!-- centre -->
<text x="360" y="222" text-anchor="middle" class="d" style="font-size:16px;fill:var(--ink);font-weight:600">One round</text>
<text x="360" y="244" text-anchor="middle" class="t" style="font-size:12.5px;fill:var(--text)">scored as the items right on every run</text>
<text x="360" y="262" text-anchor="middle" class="m" style="font-size:11.5px;fill:var(--muted)">RUN-TO-RUN VARIATION: 2 QUESTIONS</text>
<text x="214" y="412" text-anchor="end" class="m" style="font-size:11.5px;fill:var(--accent)">NEXT ROUND ↻</text>
<!-- exit: the stop rule -->
<path d="M360 450 L360 482" style="fill:none;stroke:var(--stop);stroke-width:1.6" marker-end="url(#arr)"/>
<text x="370" y="470" class="m" style="font-size:11.5px;fill:var(--stop)">CHECKED AFTER EVERY ROUND</text>
<rect x="60" y="486" width="600" height="74" rx="7" style="fill:var(--panel);stroke:var(--stop);stroke-width:1.3"/>
<text x="76" y="507" class="m" style="font-size:11.5px;fill:var(--stop);letter-spacing:.06em">STOP RULE · WRITTEN DOWN BEFORE THE FIRST ROUND</text>
<text x="76" y="527" class="t" style="font-size:13.5px;fill:var(--ink);font-weight:600">Two rounds in a row within run-to-run variation, and no predicted flip lands</text>
<text x="76" y="547" class="t" style="font-size:12.5px;fill:var(--text)">then stop, report where it levelled off, and take the gap to the sponsor</text>
</svg>
