<svg viewBox="0 0 720 530" role="img" aria-label="Generating metrics: past SQL and BI reports feed metric generation, then witness against the warehouse, resolve conflicts, and approve; past SQL also feeds a trusted-query library for the exploratory lane">
<title>Generating metrics</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker></defs>
<text x="16" y="20" class="m" style="font-size:10px;letter-spacing:.08em;fill:var(--muted)">SOURCES · READ-ONLY</text>
<g class="t">
  <rect x="16" y="30" width="336" height="56" rx="7" style="fill:var(--panel);stroke:var(--ink);stroke-width:1.5"/>
  <text x="30" y="53" style="font-size:13px;fill:var(--ink);font-weight:600">Past SQL (query history)</text>
  <text x="30" y="71" style="font-size:10.5px;fill:var(--text)">what analysts actually ran, who ran it, how often, when</text>
  <rect x="368" y="30" width="336" height="56" rx="7" style="fill:var(--panel);stroke:var(--ink);stroke-width:1.5"/>
  <text x="382" y="53" style="font-size:13px;fill:var(--ink);font-weight:600">BI reports and semantic models</text>
  <text x="382" y="71" style="font-size:10.5px;fill:var(--text)">the numbers leaders already see, and how they are built</text>
</g>
<g style="fill:none;stroke:var(--muted);stroke-width:1.4">
  <path d="M124 86 L124 134" marker-end="url(#arr)"/>
  <path d="M300 86 L300 110 L400 110 L400 134" marker-end="url(#arr)"/>
  <path d="M536 86 L536 134" marker-end="url(#arr)"/>
</g>
<text x="16" y="124" class="m" style="font-size:10px;letter-spacing:.08em;fill:var(--ink);font-weight:500">EXPLORATORY LANE</text>
<text x="704" y="124" text-anchor="end" class="m" style="font-size:10px;letter-spacing:.08em;fill:var(--accent);font-weight:500">GOVERNED LANE</text>
<!-- exploratory -->
<g class="t">
  <rect x="16" y="136" width="216" height="62" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/>
  <text x="28" y="157" style="font-size:12px;fill:var(--ink);font-weight:600">Keep what analysts trust</text>
  <text x="28" y="174" style="font-size:10.5px;fill:var(--text)">machine traffic out, duplicates</text>
  <text x="28" y="188" style="font-size:10.5px;fill:var(--text)">merged, ranked by who ran it</text>
  <rect x="16" y="216" width="216" height="82" rx="7" style="fill:var(--tint);stroke:var(--accent);stroke-width:1.5"/>
  <text x="28" y="236" class="m" style="font-size:10px;fill:var(--accent);letter-spacing:.06em">TRUSTED-QUERY LIBRARY</text>
  <text x="28" y="255" style="font-size:10.5px;fill:var(--text)">complete past SQL, with who</text>
  <text x="28" y="269" style="font-size:10.5px;fill:var(--text)">ran it and how often; the agent</text>
  <text x="28" y="283" style="font-size:10.5px;fill:var(--text)">writes its own SQL from it</text>
</g>
<path d="M124 198 L124 214" style="fill:none;stroke:var(--muted);stroke-width:1.4" marker-end="url(#arr)"/>
<!-- governed -->
<g class="t">
  <rect x="264" y="136" width="440" height="62" rx="7" style="fill:var(--bg);stroke:var(--accent);stroke-width:1.5"/>
  <text x="278" y="156" class="m" style="font-size:10px;fill:var(--accent);letter-spacing:.06em">1 · GENERATE METRICS</text>
  <text x="278" y="174" style="font-size:12px;fill:var(--ink);font-weight:600">A metrics generator: your script or a product</text>
  <text x="278" y="189" style="font-size:10.5px;fill:var(--text)">candidate metrics drafted from the SQL and BI above</text>
  <rect x="264" y="216" width="440" height="62" rx="7" style="fill:var(--bg);stroke:var(--accent);stroke-width:1.5"/>
  <text x="278" y="236" class="m" style="font-size:10px;fill:var(--accent);letter-spacing:.06em">2 · WITNESS AGAINST THE WAREHOUSE</text>
  <text x="278" y="254" style="font-size:12px;fill:var(--ink);font-weight:600">Every candidate run, read-only</text>
  <text x="278" y="269" style="font-size:10.5px;fill:var(--text)">runs clean, one row per key, matches the report it came from</text>
  <rect x="264" y="296" width="440" height="78" rx="7" style="fill:var(--bg);stroke:var(--accent);stroke-width:1.5"/>
  <text x="278" y="316" class="m" style="font-size:10px;fill:var(--accent);letter-spacing:.06em">3 · RESOLVE CONFLICTS</text>
  <text x="278" y="334" style="font-size:12px;fill:var(--ink);font-weight:600">Provenance first, then the domain owner</text>
  <text x="278" y="350" style="font-size:10.5px;fill:var(--text)">who ran it, how often, how recently, does it match the warehouse;</text>
  <text x="278" y="364" style="font-size:10.5px;fill:var(--text)">the owner settles only what provenance cannot</text>
  <rect x="264" y="392" width="440" height="62" rx="7" style="fill:var(--tint);stroke:var(--accent);stroke-width:1.8"/>
  <text x="278" y="412" class="m" style="font-size:10px;fill:var(--accent);letter-spacing:.06em">4 · METRICS</text>
  <text x="278" y="430" style="font-size:12px;fill:var(--ink);font-weight:600">SQL, an owner, a version and provenance on each</text>
  <text x="278" y="445" style="font-size:10.5px;fill:var(--text)">the rule lives inside the metric, not in a description</text>
</g>
<g style="fill:none;stroke:var(--muted);stroke-width:1.4">
  <path d="M484 198 L484 214" marker-end="url(#arr)"/>
  <path d="M484 278 L484 294" marker-end="url(#arr)"/>
  <path d="M484 374 L484 390" marker-end="url(#arr)"/>
  <path d="M124 298 L124 476" marker-end="url(#arr)"/>
  <path d="M484 454 L484 476" marker-end="url(#arr)"/>
</g>
<rect x="16" y="478" width="688" height="44" rx="8" style="fill:var(--bg);stroke:var(--ink);stroke-width:2"/>
<text x="30" y="499" class="t" style="font-size:12.5px;fill:var(--ink);font-weight:600">Both lanes served to your agent from one context layer</text>
<text x="30" y="514" class="t" style="font-size:10.5px;fill:var(--text)">a number the business runs on comes from a metric; everything else from trusted past SQL</text>
</svg>
