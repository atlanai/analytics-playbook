<svg viewBox="0 0 704 638" role="img" aria-label="Building the golden set in phase 1: harvest, draft, rubric, verify, seal, baseline, gate, behind a wall the context engineer never sees past">
<title>Building the golden set</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker></defs>
<text x="8" y="20" class="m" style="font-size:11.5px;letter-spacing:.08em;fill:var(--ink);font-weight:500">THE GOLDEN-SET SIDE</text>
<text x="504" y="20" class="m" style="font-size:11.5px;letter-spacing:.08em;fill:var(--ink);font-weight:500">THE CONTEXT SIDE</text>
<g class="t">
  <rect x="8" y="30" width="448" height="98" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/>
  <text x="20" y="49" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">HARVEST</text>
  <text x="444" y="49" text-anchor="end" class="m" style="font-size:11.5px;fill:var(--muted);letter-spacing:.04em">EVAL OWNER</text>
  <text x="20" y="68" style="font-size:13.5px;fill:var(--ink);font-weight:600">2-3× the questions you will seal,</text>
  <text x="20" y="85" style="font-size:13.5px;fill:var(--ink);font-weight:600">from what the business asks</text>
  <text x="20" y="103" style="font-size:12px;fill:var(--text)">from the board pack, dashboards, tickets and leaders;</text>
  <text x="20" y="119" style="font-size:12px;fill:var(--text)">rewritten as a user asks</text>
  <rect x="8" y="140" width="448" height="65" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/>
  <text x="20" y="159" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">DRAFT</text>
  <text x="444" y="159" text-anchor="end" class="m" style="font-size:11.5px;fill:var(--muted);letter-spacing:.04em">GRADERS</text>
  <text x="20" y="178" style="font-size:13.5px;fill:var(--ink);font-weight:600">Expected SQL and answer, one format per item</text>
  <text x="20" y="196" style="font-size:12px;fill:var(--text)">six fields required, the rest optional</text>
  <rect x="8" y="217" width="448" height="65" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/>
  <text x="20" y="236" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">RUBRIC</text>
  <text x="444" y="236" text-anchor="end" class="m" style="font-size:11.5px;fill:var(--muted);letter-spacing:.04em">EVAL OWNER</text>
  <text x="20" y="255" style="font-size:13.5px;fill:var(--ink);font-weight:600">How each answer is graded, before any result</text>
  <text x="20" y="273" style="font-size:12px;fill:var(--text)">a tolerance per answer type; an LLM judge checks the shape</text>
  <rect x="8" y="294" width="448" height="65" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/>
  <text x="20" y="313" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">VERIFY</text>
  <text x="444" y="313" text-anchor="end" class="m" style="font-size:11.5px;fill:var(--muted);letter-spacing:.04em">GRADERS · DOMAIN OWNER</text>
  <text x="20" y="332" style="font-size:13.5px;fill:var(--ink);font-weight:600">Every draft checked against its source</text>
  <text x="20" y="350" style="font-size:12px;fill:var(--text)">a dispute goes to the domain owner, who decides</text>
  <rect x="8" y="371" width="448" height="65" rx="7" style="fill:var(--bg);stroke:var(--accent);stroke-width:1.8"/>
  <text x="20" y="390" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">SEAL</text>
  <text x="444" y="390" text-anchor="end" class="m" style="font-size:11.5px;fill:var(--muted);letter-spacing:.04em">EVAL OWNER</text>
  <text x="20" y="409" style="font-size:13.5px;fill:var(--ink);font-weight:600">Pick at least 20</text>
  <text x="20" y="427" style="font-size:12px;fill:var(--text)">hashed, committed, stored where no agent or pipeline reads</text>
  <rect x="8" y="448" width="448" height="65" rx="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.5"/>
  <text x="20" y="467" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">BASELINE</text>
  <text x="444" y="467" text-anchor="end" class="m" style="font-size:11.5px;fill:var(--muted);letter-spacing:.04em">AGENT BUILDER RUNS · EVAL OWNER GRADES</text>
  <text x="20" y="486" style="font-size:13.5px;fill:var(--ink);font-weight:600">Bare schema, once per question</text>
  <text x="20" y="504" style="font-size:12px;fill:var(--text)">the number every later change is measured against</text>
  <rect x="8" y="525" width="448" height="65" rx="7" style="fill:var(--tint);stroke:var(--accent);stroke-width:1.5"/>
  <text x="20" y="544" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">PHASE 1 GATE</text>
  <text x="444" y="544" text-anchor="end" class="m" style="font-size:11.5px;fill:var(--muted);letter-spacing:.04em">EXEC SPONSOR</text>
  <text x="20" y="563" style="font-size:13.5px;fill:var(--ink);font-weight:600">20+ sealed, and the baseline has run</text>
  <text x="20" y="581" style="font-size:12px;fill:var(--text)">the sponsor sees where the agent starts</text>
</g>
<g style="fill:none;stroke:var(--muted);stroke-width:1.4">
  <path d="M232 128 L232 138" marker-end="url(#arr)"/>
  <path d="M232 205 L232 215" marker-end="url(#arr)"/>
  <path d="M232 282 L232 292" marker-end="url(#arr)"/>
  <path d="M232 359 L232 369" marker-end="url(#arr)"/>
  <path d="M232 436 L232 446" marker-end="url(#arr)"/>
  <path d="M232 513 L232 523" marker-end="url(#arr)"/>
</g>
<!-- the wall -->
<path d="M480 30 L480 590" style="fill:none;stroke:var(--ink);stroke-width:4"/>
<text x="352" y="614" text-anchor="middle" class="m" style="font-size:11.5px;letter-spacing:.06em;fill:var(--ink);font-weight:500">THE WALL · THE CONTEXT ENGINEER NEVER SEES THE GOLDEN SET</text>
<text x="352" y="630" text-anchor="middle" class="m" style="font-size:11.5px;fill:var(--muted)">TWO THINGS CROSS IT: A CONFLICT WITH NO SEALED VALUE, AND HASHES</text>
<!-- crossings -->
<path d="M456 326 L502 326" style="fill:none;stroke:var(--accent);stroke-width:1.8" marker-end="url(#arr)"/>
<path d="M456 403 L502 403" style="fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:4 3" marker-end="url(#arr)"/>
<!-- context side -->
<g class="t" style="font-size:12px">
  <rect x="504" y="30" width="192" height="175" rx="7" style="fill:var(--panel);stroke:var(--line-2);stroke-width:1.2"/>
  <text x="516" y="49" class="m" style="font-size:11.5px;fill:var(--muted);letter-spacing:.04em">CONTEXT ENGINEER</text>
  <text x="516" y="68" style="font-size:13.5px;fill:var(--ink);font-weight:600">Explores, approves</text>
  <text x="516" y="85" style="font-size:13.5px;fill:var(--ink);font-weight:600">nothing</text>
  <text x="516" y="104" style="fill:var(--text)">reads past SQL and BI,</text>
  <text x="516" y="120" style="fill:var(--text)">ranks what analysts trust,</text>
  <text x="516" y="136" style="fill:var(--text)">lists likely conflicts</text>
  <text x="516" y="193" class="m" style="font-size:11.5px;fill:var(--muted)">NOTHING APPROVED YET</text>
  <rect x="504" y="294" width="192" height="65" rx="7" style="fill:var(--tint);stroke:var(--accent);stroke-width:1.5"/>
  <text x="516" y="313" class="m" style="font-size:11.5px;fill:var(--accent);letter-spacing:.04em">REVIEW QUEUE</text>
  <text x="516" y="330" style="fill:var(--text)">a definition dispute also</text>
  <text x="516" y="346" style="fill:var(--text)">files here as a conflict</text>
  <rect x="504" y="371" width="192" height="65" rx="7" style="fill:var(--bg);stroke:var(--line-2);stroke-width:1.2"/>
  <text x="516" y="390" class="m" style="font-size:11.5px;fill:var(--muted);letter-spacing:.04em">PAST SQL</text>
  <text x="516" y="407" style="fill:var(--text)">purged by hash; each</text>
  <text x="516" y="423" style="fill:var(--text)">exclusion audited</text>
  <rect x="504" y="448" width="192" height="142" rx="7" style="fill:var(--panel);stroke:var(--stop);stroke-width:1.3"/>
  <text x="516" y="467" class="m" style="font-size:11.5px;fill:var(--stop);letter-spacing:.04em">NEVER CROSSES</text>
  <text x="516" y="484" style="fill:var(--text)">expected answers and SQL</text>
  <text x="516" y="500" style="fill:var(--text)">decisions and their history</text>
  <text x="516" y="516" style="fill:var(--text)">the questions sealed later</text>
  <text x="516" y="540" style="fill:var(--text)">the agent sees only the</text>
  <text x="516" y="556" style="fill:var(--text)">question as a user asks it</text>
</g>
</svg>
