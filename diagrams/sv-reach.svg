<svg style="font-family:var(--body)" viewBox="10 8 732 322" role="img" aria-label="Where each tool defines a metric, and what bounds it: LookML, Malloy and Cube on a table or source; Snowflake semantic views, Databricks metric views, Apache Ossie and Databricks Genie in one view, model or agent; dbt MetricFlow ratio metrics at project level" font-size="12"><defs><marker id="vendor-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--line-2)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--ink)">Where each tool defines a metric, and what bounds it</text><rect x="24" y="64" width="224" height="218" rx="8" fill="none" fill-opacity="1" stroke="var(--line-2)" stroke-width="1.25"></rect><text x="40" y="88" font-size="13" font-weight="600" fill="var(--ink)">On a table or source</text><rect x="40" y="104" width="192" height="26" rx="6" fill="none" fill-opacity="1" stroke="var(--line-2)" stroke-width="1.25"></rect><text x="136" y="121" text-anchor="middle" fill="var(--ink)">Looker (LookML)</text><rect x="40" y="138" width="192" height="26" rx="6" fill="none" fill-opacity="1" stroke="var(--line-2)" stroke-width="1.25"></rect><text x="136" y="155" text-anchor="middle" fill="var(--ink)">Malloy</text><rect x="40" y="172" width="192" height="26" rx="6" fill="none" fill-opacity="1" stroke="var(--line-2)" stroke-width="1.25"></rect><text x="136" y="189" text-anchor="middle" fill="var(--ink)">Cube</text><text x="40" y="230" fill="var(--muted)">reaches other tables</text><text x="40" y="246" fill="var(--muted)">through its joins</text><rect x="264" y="64" width="224" height="218" rx="8" fill="none" fill-opacity="1" stroke="var(--line-2)" stroke-width="1.25"></rect><text x="280" y="88" font-size="13" font-weight="600" fill="var(--ink)">In one view or model</text><rect x="280" y="104" width="192" height="26" rx="6" fill="none" fill-opacity="1" stroke="var(--line-2)" stroke-width="1.25"></rect><text x="376" y="121" text-anchor="middle" fill="var(--ink)">Snowflake semantic views</text><rect x="280" y="138" width="192" height="26" rx="6" fill="none" fill-opacity="1" stroke="var(--line-2)" stroke-width="1.25"></rect><text x="376" y="155" text-anchor="middle" fill="var(--ink)">Databricks metric views</text><rect x="280" y="172" width="192" height="26" rx="6" fill="none" fill-opacity="1" stroke="var(--line-2)" stroke-width="1.25"></rect><text x="376" y="189" text-anchor="middle" fill="var(--ink)">Apache Ossie (formerly OSI)</text><rect x="280" y="206" width="192" height="26" rx="6" fill="none" fill-opacity="1" stroke="var(--line-2)" stroke-width="1.25"></rect><text x="376" y="223" text-anchor="middle" fill="var(--ink)">Databricks Genie</text><text x="280" y="254" fill="var(--muted)">reaches only the tables in</text><text x="280" y="270" fill="var(--muted)">its view, model or agent</text><rect x="504" y="64" width="224" height="218" rx="8" fill="none" fill-opacity="1" stroke="var(--line-2)" stroke-width="1.25"></rect><text x="520" y="88" font-size="13" font-weight="600" fill="var(--ink)">At project level</text><rect x="520" y="104" width="192" height="26" rx="6" fill="none" fill-opacity="1" stroke="var(--line-2)" stroke-width="1.25"></rect><text x="616" y="121" text-anchor="middle" fill="var(--ink)">dbt MetricFlow</text><text x="520" y="162" fill="var(--ink)">ratio metrics combine</text><text x="520" y="178" fill="var(--ink)">metrics from different</text><text x="520" y="194" fill="var(--ink)">semantic models; entities</text><text x="520" y="210" fill="var(--ink)">are the join keys</text><path d="M24 300H726" fill="none" stroke="var(--line-2)" stroke-width="1.25" marker-end="url(#vendor-arrow)"></path><text x="24" y="320" fill="var(--muted)">metric tied to one table</text><text x="728" y="320" text-anchor="end" fill="var(--muted)">metric tied to no single table</text></svg>