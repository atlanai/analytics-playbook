<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);}, $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s));};
var store={get:function(k,d){try{var v=localStorage.getItem('pb.'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
           set:function(k,v){try{localStorage.setItem('pb.'+k,JSON.stringify(v));}catch(e){}},
           del:function(k){try{localStorage.removeItem('pb.'+k);}catch(e){}}};
var shell=$('.shell'), MODE=shell.getAttribute('data-mode')||'artifact', SPA=MODE!=='site';
var articles=$$('article.ch'), byId={}; articles.forEach(function(a){byId[a.id]=a;});
var chapters=[]; try{chapters=JSON.parse($('#chapters').textContent);}catch(e){}
var idx=[]; try{idx=JSON.parse($('#idx').textContent);}catch(e){}
var role=store.get('role',null), rolePath=store.get('path',[]), pathInfo=store.get('pathinfo',[]);
/* a reading path is a list of anchors: chapters, sections (#ch02-lanes), a chapter's opening (#start-intro) or cards (#c2).
   pathInfo holds {id, a (its article), t (its title)} per step, saved with the path so every page can use it. */
function stepOf(k){ var id=rolePath[k]; if(id===undefined) return null; for(var i=0;i<pathInfo.length;i++) if(pathInfo[i].id===id) return pathInfo[i];
  var el=document.getElementById(id), art=el&&el.closest?el.closest('article.ch'):null, c=chapters[chapterIndex(id)];
  return {id:id,a:art?art.id:id,t:c?c.t:id}; }
function stepsIn(aid){ var out=[]; for(var k=0;k<rolePath.length;k++){ var s=stepOf(k); if(s&&s.a===aid) out.push(k); } return out; }
/* declared before the first route(): a later `var spy=null` used to orphan the first scroll-spy observer */
var spy=null;

/* ---- theme ---- */
(function(){
  var root=document.documentElement, btn=$('.tb-theme'), order=['auto','light','dark'];
  function apply(t){ if(t==='light'||t==='dark') root.setAttribute('data-theme',t); else root.removeAttribute('data-theme');
    btn.textContent=t.charAt(0).toUpperCase()+t.slice(1); btn.setAttribute('aria-label','Colour theme: '+t); }
  var cur=store.get('theme','light'); var qm=/[?&]theme=(light|dark|auto)/.exec(location.search); if(qm) cur=qm[1]; apply(cur);
  btn.addEventListener('click',function(){ cur=order[(order.indexOf(cur)+1)%3]; apply(cur); store.set('theme',cur); });
})();

/* ---- helpers ---- */
function articleOf(el){ return el && el.closest ? el.closest('article.ch') : null; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function chapterIndex(id){ for(var i=0;i<chapters.length;i++) if(chapters[i].id===id) return i; return -1; }

/* ---- prev / next footers ---- */
function buildFoot(a){
  var foot=$('.ch-foot',a); if(!foot||!SPA) return;
  var i=chapterIndex(a.id), prev=i>0?chapters[i-1]:null, next=i>=0&&i<chapters.length-1?chapters[i+1]:null;
  if(a.id==='home'){ next=chapters[0]||null; }
  var pathNext=null, pathPrev=null;
  if(rolePath.length){ var ks=stepsIn(a.id); if(ks.length){ pathNext=stepOf(ks[ks.length-1]+1); pathPrev=stepOf(ks[0]-1); } }
  var h='<nav class="pn">';
  if(pathPrev) h+='<a class="prev on-path" href="#'+pathPrev.id+'"><small>Previous on your path</small>'+esc(pathPrev.t)+'</a>';
  else h+= prev?'<a class="prev" href="#'+prev.id+'"><small>Previous</small>'+esc(prev.t)+'</a>':'<span></span>';
  if(pathNext) h+='<a class="next on-path" href="#'+pathNext.id+'"><small>Next on your path</small>'+esc(pathNext.t)+'</a>';
  else if(next) h+='<a class="next" href="#'+next.id+'"><small>Next</small>'+esc(next.t)+'</a>'; else h+='<span></span>';
  foot.innerHTML=h+'</nav>';
}
articles.forEach(buildFoot);

/* ---- path navs inside chapters: a path step that is a section, an opening or a card ends with its own
   previous / next on the path (the chapter footer covers a step that runs to the end of its chapter) ---- */
function paintPathNavs(){
  $$('nav.pn-path').forEach(function(n){ n.remove(); });
  if(!SPA||!rolePath.length) return;
  for(var k=0;k<rolePath.length;k++){
    var st=stepOf(k), el=st&&document.getElementById(st.id); if(!el||byId[st.id]===el) continue;
    var art=el.closest('article.ch'); if(!art) continue;
    var nx=stepOf(k+1), pv=stepOf(k-1), where=null, before=null;
    if(el.classList.contains('ch-head')){ before=$$(':scope > section.level2',art)[0]||null; if(!before) continue; }
    else if(el.tagName==='SECTION'){
      if(el.classList.contains('level2')||el.classList.contains('level3')){ var tops=$$(':scope > section.level2',art); if(tops.length&&tops[tops.length-1]===el.closest('section.level2')&&!el.classList.contains('level3')) continue; }
      where=el; }
    else continue;
    var h='<nav class="pn pn-path" aria-label="Your reading path">'+(pv?'<a class="prev on-path" href="#'+pv.id+'"><small>Previous on your path</small>'+esc(pv.t)+'</a>':'<span></span>')
      +(nx?'<a class="next on-path" href="#'+nx.id+'"><small>Next on your path</small>'+esc(nx.t)+'</a>':'<span></span>')+'</nav>';
    var box=document.createElement('div'); box.innerHTML=h; var nav=box.firstChild;
    if(before) art.insertBefore(nav,before); else if(where.classList.contains('card')){ var body=$('.card-body',where)||where; body.appendChild(nav); } else where.appendChild(nav);
  }
}
paintPathNavs();

/* ---- router ---- */
var current=null;
/* wide screens give "on this page" its own right column; narrower ones keep it under the chapter in the contents */
var wideRail=window.matchMedia?matchMedia("(min-width:1360px)"):{matches:false};
if(wideRail.addEventListener) wideRail.addEventListener('change',function(){ if(current) setNav(current.id); });
/* the active chapter in the contents carries "on this page" under it, and the top bar names where you are */
function setNav(id){ var on=null;
  $$('nav.toc a[data-ch]').forEach(function(a){ var m=a.getAttribute('data-ch')===id; a.classList.toggle('on',m); if(m) on=a; });
  if(on){ var grp=on.closest('details.toc-part'); if(grp) grp.open=true; }
  renderPathNav(id);
  var rail=$('.rail'), toc=$('nav.toc');
  if(rail&&on&&rail.dataset.for!==id){ rail.classList.remove('folded'); rail.dataset.for=id; }
  if(rail){ if(on){ var col=$('.rail-col'), wide=col&&wideRail.matches; if(wide){ if(rail.parentNode!==col) col.appendChild(rail); } else if(rail.parentNode!==on.parentNode) on.parentNode.appendChild(rail); rail.hidden=false; } else { rail.hidden=true; } }
  if(on&&toc&&toc.scrollHeight>toc.clientHeight){ var t=on.offsetTop; if(t<toc.scrollTop+40||t>toc.scrollTop+toc.clientHeight-120) toc.scrollTop=Math.max(0,t-120); }
  var w=$('.tb-where'); if(w){ if(!on){ w.textContent=''; } else { var pl=on.closest('.toc-part'), part=pl?($('.toc-g',pl)||$('.toc-part-label',pl)||{}).textContent||'':'', t=(($('.toc-t',on)||{}).textContent||'').trim();
    w.innerHTML=(part&&part!==t?esc(part)+' / ':'')+'<b>'+esc(t)+'</b>'; } } }
function show(a){
  if(!SPA) return;
  articles.forEach(function(x){ x.classList.toggle('off', x!==a); });
  current=a; setNav(a.id); buildRail(a); buildFoot(a);
  document.title=(a.id==='home'?'':(($('.ch-head h1',a)||{}).textContent||'').trim()+' · ')+'The FDE Playbook for Analytics Agents';
}
function route(){
  var h=decodeURIComponent(location.hash.replace(/^#/,''))||'home';
  var parts=h.split('/'), target=document.getElementById(parts[0]);
  if(!target && parts[1]) target=document.getElementById(parts[1]);
  if(!target) target=byId.home||articles[0];
  var a=articleOf(target)||target;
  if(SPA){ show(a); }
  /* one chapter shown: a chapter link starts at the top */
  if(target===a){ window.scrollTo({top:0,behavior:'auto'}); }
  else { target.scrollIntoView({block:'start',behavior:'instant'}); }
  if(target!==a && target.id){ target.classList.add('is-target'); }
  if(document.body.classList.contains('nav-open')) setDrawer(false);
  if(!SPA && current===null){ current=a; setNav(a.id); buildRail(a); }
}
if(SPA){ addEventListener('hashchange',route); addEventListener('popstate',route); }
/* Handle in-page anchor clicks ourselves: some hosts (the artifact viewer) intercept #links and
   scroll natively, which fails when the target sits in a chapter that is currently hidden. */
document.addEventListener('click',function(e){
  if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
  var a=e.target.closest?e.target.closest('a[href^="#"]'):null;
  if(!a||a.hasAttribute('download')||(a.hasAttribute('data-podcast')&&document.body.classList.contains('audio-ready'))) return;
  var h=a.getAttribute('href'); if(!h||h==='#') return;
  e.preventDefault(); e.stopPropagation();
  if(a.matches('nav.toc a[data-ch].on')){ var rl=$('nav.toc .rail'); if(rl&&rl.parentNode===a.parentNode){ rl.classList.toggle('folded'); a.setAttribute('aria-expanded',String(!rl.classList.contains('folded'))); return; } }
  if(location.hash!==h){ try{ history.pushState(null,'',h); }catch(_){ try{ location.hash=h; }catch(__){} return; } }
  route();
},true);
route();
if(!SPA){ current=articles[0]; setNav(current.id); buildRail(current); }
addEventListener('beforeprint',function(){ articles.forEach(function(x){x.classList.remove('off');}); });
addEventListener('afterprint',function(){ route(); });

/* ---- page menu: copy, view or open the current page's Markdown in an agent. The site fetches <id>.md beside the
   page; the single-file edition carries every page inline. Links in the Markdown are relative: the base is the build's
   PB_SITE_URL when set, else the address this page was served from, so the copy follows whichever domain serves it.
   With no base (a local single file), the "Open in" items hide: an agent can't fetch a page from a laptop. ---- */
(function(){
  var box=$('.tb-page'); if(!box) return;
  var btn=$('.pm-copy',box), tog=$('.pm-tog',box), menu=$('.pm-menu',box);
  /* served under a path such as /analytics-playbook with no trailing slash, the last segment is still the folder */
  function here(){ var p=location.pathname, last=p.split('/').pop(); if(last&&!/\.[a-z0-9]+$/i.test(last)) p+='/';
    return location.origin+p.replace(/[^\/]*$/,''); }
  var SITE=box.getAttribute('data-site')||(/^https?:$/.test(location.protocol)&&MODE!=='artifact'?here():'');
  var inline={}; try{ inline=JSON.parse($('#md').textContent); }catch(e){}
  var has={home:1}; chapters.forEach(function(c){ if(c.m) has[c.id]=1; });
  var AGENTS={claude:'https://claude.ai/new?q=', chatgpt:'https://chatgpt.com/?hints=search&q=', perplexity:'https://www.perplexity.ai/search?q='};
  function page(){ var id=current?current.id:'home'; return has[id]?id:'home'; }
  function file(id){ return id==='home'?'index.md':id+'.md'; }
  /* a pasted copy has no address of its own, so its relative links are made absolute */
  function absolute(t){ return SITE?t.replace(/\]\((?![a-z][\w+.-]*:|#|\/)([^)\s]+)\)/gi,function(_,u){ return ']('+new URL(u,SITE).href+')'; }):t; }
  function text(id){ return (inline[id]?Promise.resolve(inline[id]):fetch(file(id)).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })).then(absolute); }
  if(!SITE) $$('[data-act=claude],[data-act=chatgpt],[data-act=perplexity],hr',menu).forEach(function(x){ x.hidden=true; });
  function flash(msg){ var l=$('.pm-label',btn); l.textContent=msg; btn.classList.toggle('ok',msg==='Copied');
    setTimeout(function(){ l.textContent='Copy page'; btn.classList.remove('ok'); },1600); }
  function copy(){
    var id=page(), done=function(){ flash('Copied'); }, fail=function(){ flash('Copy failed'); };
    if(!navigator.clipboard) return fail();
    if(inline[id]) return navigator.clipboard.writeText(absolute(inline[id])).then(done,fail);
    /* Safari only allows the write inside the click, so hand it the pending fetch */
    if(window.ClipboardItem&&navigator.clipboard.write){
      var blob=text(id).then(function(t){ return new Blob([t],{type:'text/plain'}); });
      return navigator.clipboard.write([new ClipboardItem({'text/plain':blob})]).then(done,function(){
        text(id).then(function(t){ return navigator.clipboard.writeText(t); }).then(done,fail); }); }
    text(id).then(function(t){ return navigator.clipboard.writeText(t); }).then(done,fail);
  }
  function view(id){
    var u=inline[id]?URL.createObjectURL(new Blob([inline[id]],{type:'text/plain;charset=utf-8'})):file(id);
    window.open(u,'_blank','noopener');
  }
  function setOpen(on){ menu.hidden=!on; tog.setAttribute('aria-expanded',String(on)); if(on){ var f=$('[role=menuitem]',menu); if(f) f.focus(); } }
  btn.addEventListener('click',copy);
  tog.addEventListener('click',function(){ setOpen(menu.hidden); });
  menu.addEventListener('click',function(e){
    var it=e.target.closest('[data-act]'); if(!it) return;
    var act=it.getAttribute('data-act'), id=page(); setOpen(false);
    if(act==='copy') copy();
    else if(act==='view') view(id);
    else window.open(AGENTS[act]+encodeURIComponent('Read from '+SITE+file(id)+' so I can ask questions about it.'),'_blank','noopener');
  });
  menu.addEventListener('keydown',function(e){
    var items=$$('[role=menuitem]',menu), i=items.indexOf(document.activeElement);
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); items[(i+(e.key==='ArrowDown'?1:items.length-1))%items.length].focus(); }
    else if(e.key==='Home'||e.key==='End'){ e.preventDefault(); items[e.key==='Home'?0:items.length-1].focus(); }
  });
  document.addEventListener('click',function(e){ if(!menu.hidden&&!box.contains(e.target)) setOpen(false); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!menu.hidden){ setOpen(false); tog.focus(); } });
})();

/* ---- contents drawer (phone) ---- */
function setDrawer(open){ var b=$('.tb-nav'), n=$('nav.toc'); document.body.classList.toggle('nav-open',open); b.setAttribute('aria-expanded',String(open));
  var t=b.querySelector('.tb-nav-t'); if(t) t.textContent=open?'Close':'Contents';
  if(open&&n){ var top=Math.round($('.topbar').getBoundingClientRect().bottom); n.style.setProperty('--drawer-top',top+'px'); document.documentElement.style.setProperty('--drawer-top',top+'px');
    var on=n.querySelector('a.on'); n.scrollTop=0; if(on){ var r=on.getBoundingClientRect(), nr=n.getBoundingClientRect(); if(r.top>nr.top+nr.height*.6) n.scrollTop=r.top-nr.top-nr.height*.3; } } }

addEventListener('keydown',function(e){ if(e.key==='Escape'&&document.body.classList.contains('nav-open')) setDrawer(false); });

/* ---- your path: the chosen reading path as a stepper at the top of the contents ---- */
/* called from the first route(), before the rest of this script has run: no later `var`s in here */
function renderPathNav(curId){ var box=$('#toc-path'); if(!box) return;
  if(!(rolePath.length&&role)){ box.innerHTML=''; return; }
  var names={'i-m-sponsoring-it':'Sponsor','i-m-building-it':'Builder','i-m-running-it':'Delivery lead'};
  var rd=(typeof read==='object'&&read)?read:store.get('read',{}), here=curId?stepsIn(curId):[], done=0, items=[];
  for(var k=0;k<rolePath.length;k++){ var st=stepOf(k); if(!st) continue;
    var state=here.indexOf(k)>=0?'here':(rd[st.a]?'done':''); if(rd[st.a]) done++;
    var parts=String(st.t).split(' · '), title=parts.pop(), kick=parts.length?parts[0]:'';
    items.push('<li class="ps '+state+'"><a href="#'+esc(st.id)+'"><i class="ps-dot" aria-hidden="true"></i>'+(kick?'<small class="ps-k">'+esc(kick)+'</small>':'')+'<span class="ps-t">'+esc(title)+'</span></a></li>'); }
  box.innerHTML='<div class="ps-head"><span class="toc-part-label">Your path · '+esc(names[role]||role)+'</span><span class="ps-prog">'+done+' of '+rolePath.length+'</span></div><ol class="ps-list">'+items.join('')+'</ol>'
    +'<div class="ps-foot"><button type="button" class="ps-stop">Stop following</button><button type="button" class="ps-change">Change path</button></div>';
  var stop=$('.ps-stop',box); if(stop) stop.addEventListener('click',clearPath);
  var chg=$('.ps-change',box); if(chg) chg.addEventListener('click',function(){ clearPath(); location.hash='#home'; }); }
/* a path stopped or chosen in another tab: resync from storage and repaint */
addEventListener('storage',function(e){ if(!e.key||e.key.indexOf('pb.')!==0) return;
  role=store.get('role',null); rolePath=store.get('path',[]); pathInfo=store.get('pathinfo',[]); if(typeof read==='object') read=store.get('read',{}); markPath(); if(typeof paintMarks==='function') paintMarks(); });
function clearPath(){ role=null; rolePath=[]; pathInfo=[]; store.del('role'); store.del('path'); store.del('pathinfo'); markPath(); }

/* ---- rail: on this page + scroll spy ---- */
var railFor=null;
function buildRail(a){
  var list=$('#rail-list'); if(!list) return; list.innerHTML=''; railFor=a;
  var heads=$$('section.level2 > h2, section.level3 > h3',a).filter(function(h){return h.closest('article.ch')===a;});
  heads.forEach(function(h){ var s=h.parentElement; if(!s.id) return; var li=document.createElement('li'); li.className=h.tagName==='H3'?'h3':'h2';
    var hc=h.cloneNode(true); $$('.sec-link',hc).forEach(function(x){x.remove();}); li.innerHTML='<a href="#'+s.id+'">'+esc(hc.textContent.trim())+'</a>'; list.appendChild(li); });
  if(spy) spy.disconnect();
  if(!('IntersectionObserver' in window)) return;
  var links={}; $$('#rail-list a').forEach(function(l){links[l.getAttribute('href').slice(1)]=l;});
  var secs=$$('section.level2, section.level3',a).filter(function(s){return links[s.id];});
  spy=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ Object.keys(links).forEach(function(k){links[k].classList.remove('on');}); links[e.target.id].classList.add('on'); } }); },{rootMargin:'-10% 0px -70% 0px'});
  secs.forEach(function(s){spy.observe(s);});
}


/* ---- progress bar + read marks ---- */
var bar=$('.progress i');
function progress(){ var a=current; if(!a||a.id==='home'){bar.style.width='0';return;}
  var r=a.getBoundingClientRect(), top=r.top+scrollY, h=a.offsetHeight-innerHeight; var p=h>0?Math.min(1,Math.max(0,(scrollY-top)/h)):1; bar.style.width=(p*100).toFixed(1)+'%'; }
addEventListener('scroll',progress,{passive:true}); addEventListener('resize',progress); progress();
var read=store.get('read',{});
function paintMarks(){ $$('nav.toc a[data-ch]').forEach(function(l){ var id=l.getAttribute('data-ch'), m=$('.toc-marks',l), a=byId[id], parts=[];
    if(read[id]) parts.push('<span class="read" title="Read">✓</span>');
    if(a){ var boxes=$$('.callout.done input[type=checkbox]',a); if(boxes.length){ var n=boxes.filter(function(b){return b.checked;}).length; if(n) parts.push('<span class="cnt" title="Definition of done">'+n+'/'+boxes.length+'</span>'); } }
    m.innerHTML=parts.join(''); }); renderPathNav(current?current.id:null); }
if('IntersectionObserver' in window){ var ro=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ var a=articleOf(e.target); if(a&&a.id!=='home'&&!read[a.id]){ read[a.id]=1; store.set('read',read); paintMarks(); } } }); },{threshold:.5});
  $$('.ch-foot').forEach(function(f){ro.observe(f);}); }

/* ---- role path + the doors accordion ---- */
var doors=$$('details.door');
function markPath(){ $$('nav.toc a[data-ch]').forEach(function(l){ l.classList.toggle('path', stepsIn(l.getAttribute('data-ch')).length>0); });
  doors.forEach(function(d){ var on=d.getAttribute('data-role')===role; d.classList.toggle('picked',on);
    var b=$('.door-pick',d); if(b){ b.textContent=on?'Following · click to stop':'Follow this path'; b.setAttribute('aria-pressed',String(on)); }

    if(on){ var f=stepOf(0); if(f) s.innerHTML='Marked in the contents. <a href="#'+f.id+'">Start: '+esc(f.t)+' →</a>'; } });
  if(current){ buildRail(current); articles.forEach(buildFoot); } renderPathNav(current?current.id:null); paintPathNavs(); }
$$('.door-pick').forEach(function(b){ b.addEventListener('click',function(){ var d=b.closest('.door'); if(d.getAttribute('data-role')===role){ clearPath(); return; } role=d.getAttribute('data-role'); rolePath=(d.getAttribute('data-path')||'').split(' ').filter(Boolean); try{ pathInfo=JSON.parse(d.getAttribute('data-steps')||'[]'); }catch(_){ pathInfo=[]; }
  store.set('role',role); store.set('path',rolePath); store.set('pathinfo',pathInfo); markPath(); }); });
/* one open at a time (details[name] does this natively where supported); arrow keys move between rows */
doors.forEach(function(d,i){
  d.addEventListener('toggle',function(){ if(d.open) doors.forEach(function(o){ if(o!==d&&o.open&&!printing) o.open=false; }); });
  var sum=$('summary',d); if(!sum) return;
  sum.addEventListener('keydown',function(e){ var k=e.key, j=null;
    if(k==='ArrowDown') j=(i+1)%doors.length; else if(k==='ArrowUp') j=(i-1+doors.length)%doors.length; else if(k==='Home') j=0; else if(k==='End') j=doors.length-1;
    if(j!==null){ e.preventDefault(); $('summary',doors[j]).focus(); } }); });

addEventListener('beforeprint',function(){ printing=true; doors.forEach(function(d){ d.removeAttribute('name'); d.open=true; }); });

/* ---- contents filter ---- */
(function(){
  var q=$('#toc-q'), hits=$('#toc-hits'); if(!q) return;
  function run(){ var v=q.value.trim().toLowerCase(); if(!v){ hits.hidden=true; hits.innerHTML=''; document.body.classList.remove('filtering'); return; }
    var out=[], seen=0; for(var i=0;i<idx.length&&out.length<40;i++){ var e=idx[i], t=e.t.toLowerCase(), s=(e.s||'').toLowerCase(), k=t.indexOf(v)>=0?0:(s.indexOf(v)>=0?1:-1); if(k<0) continue; out.push([k,e]); }
    out.sort(function(a,b){return a[0]-b[0];});
    var rx=new RegExp('('+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    hits.innerHTML=out.length?out.map(function(p){var e=p[1]; var ch=chapters[chapterIndex(e.ch)]; return '<a href="#'+e.id+'"><span class="k">'+esc(e.k)+(ch&&e.k!=='chapter'?' · '+esc(ch.n?ch.n:ch.t):'')+'</span>'+esc(e.t).replace(rx,'<mark>$1</mark>')+(p[0]===1?'<span class="s">'+esc(e.s).replace(rx,'<mark>$1</mark>')+'</span>':'')+'</a>';}).join(''):'<div class="s" style="padding:6px 8px;color:var(--muted)">Nothing matches.</div>';
    hits.hidden=false; document.body.classList.add('filtering'); }
  q.addEventListener('input',run); q.addEventListener('keydown',function(e){ if(e.key==='Escape'){ q.value=''; run(); q.blur(); } });
  addEventListener('keydown',function(e){ if(e.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); if(innerWidth<=900){ setDrawer(true); } q.focus(); } });
  hits.addEventListener('click',function(){ q.value=''; run(); });
})();

/* ---- checklists ---- */

      var inp=l.querySelector('input'); if(String(saved.q[n])===String(i)) inp.checked=true; inp.addEventListener('change',function(){ saved.q[n]=i; store.set('assess',saved); score(); }); });

    function show(i,j){
      cur=[i,j]; var s=stages[i], st=s.steps[j];
      [].forEach.call(x.querySelectorAll('.mx-st'),function(b,k){ b.classList.toggle('on',k===i); b.classList.toggle('done',k<i); b.setAttribute('aria-pressed',k===i); });
      list.innerHTML=s.steps.map(function(p,k){ return '<li><button type="button" class="mx-sb'+(k===j?' on':'')+'" data-j="'+k+'"><span class="mx-no">'+esc(p.k.replace(/^Step /,''))+'</span><b>'+esc(p.t)+'</b><span class="mx-s">'+esc(p.s)+'</span></button></li>'; }).join('');
      det.innerHTML='';
      if(!st){ det.innerHTML='<p class="mx-dt">'+esc(s.t)+'</p>'; return; }
      var h='<span class="mx-dk">'+esc(s.k)+' · '+esc(st.k)+'</span><p class="mx-dt">'+esc(st.t)+'</p>';
      det.innerHTML=h;
      st.rows.forEach(function(r){
        var kind=r.getAttribute('data-kind'), lab=T(r,'.mm-k'), row=document.createElement('div');
        row.className='mx-row '+(kind==='watch'?'watch':'')+(['how','who','tpl','watch'].indexOf(kind)<0?' kind':'');
        var body=r.cloneNode(true); var k=body.querySelector('.mm-k'); if(k) k.remove();
        if(row.classList.contains('kind')){ row.innerHTML='<div><b>'+esc(lab)+'</b>'+body.innerHTML+'</div>'; }
        else { row.innerHTML='<span>'+esc(lab)+'</span><div>'+body.innerHTML+'</div>'; }
        det.appendChild(row);
      });
      var n=flat.findIndex(function(p){ return p[0]===i&&p[1]===j; });
      var nav=document.createElement('div'); nav.className='mx-nav';
      nav.innerHTML='<button type="button" data-go="-1"'+(n<=0?' disabled':'')+'>← Back</button><button type="button" class="pri" data-go="1"'+(n>=flat.length-1?' disabled':'')+'>Next step →</button>'+(s.read?'<a class="mx-ch" href="'+s.read.href+'">'+esc(s.read.t)+'</a>':'');
      det.appendChild(nav);
    }
    x.addEventListener('click',function(e){
      var b=e.target.closest('.mx-st'); if(b){ show(+b.dataset.i,0); return; }
      var sb=e.target.closest('.mx-sb'); if(sb){ show(cur[0],+sb.dataset.j); return; }
      var g=e.target.closest('[data-go]'); if(g&&!g.disabled){ var n=flat.findIndex(function(p){ return p[0]===cur[0]&&p[1]===cur[1]; })+(+g.dataset.go); if(flat[n]) show(flat[n][0],flat[n][1]); }
    });
    show(0,0);
  });
})();
// star count on the sidebar GitHub link; on any failure (offline, rate limit) the link shows without a count
// the count is kept for the browser session, so moving between pages does not ask GitHub again
(function(){
  var a=$('nav.toc .toc-repo'), repo=a&&a.dataset.repo; if(!repo||!window.fetch) return;
  var key='pb.stars.'+repo;
  function show(n){
    var s=$('.toc-stars',a); s.lastChild.textContent=new Intl.NumberFormat('en',{notation:'compact'}).format(n); s.hidden=false;
    a.setAttribute('aria-label','GitHub repository, '+n+' stars');
  }
  var cached; try{ cached=sessionStorage.getItem(key); }catch(e){}
  if(cached!==null&&cached!==undefined&&!isNaN(+cached)){ show(+cached); return; }
  fetch('https://api.github.com/repos/'+repo).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(d){
    if(typeof d.stargazers_count!=='number') return;
    try{ sessionStorage.setItem(key,String(d.stargazers_count)); }catch(e){}
    show(d.stargazers_count);
  }).catch(function(){});
})();
})();
</script>
