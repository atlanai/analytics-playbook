<title>{{TITLE}}</title>
<link rel="icon" type="image/svg+xml" href="{{FAVICON}}">
<style>
/* =====================================================================
   REFERENCE EDITION: the playbook set like good documentation.
   Three columns on wide screens (the book / the page / on this page), one left edge for text and
   figures, one type family (IBM Plex Sans) with Plex Mono for code and IDs only, hierarchy by weight
   and space rather than boxes, Atlan blue for links and "you are here". Tokens on :root; dark guarded.
   ===================================================================== */
:root{
  --bg:#FFFFFF; --plate:#F7F8FA; --panel:#F0F1F5; --tint:#EEF0FE; --line:#E6E7ED; --line-2:#CDD0DA;
  --ink:#0F1117; --text:#2B2E38; --muted:#646877;
  --accent:#2026D2; --accent-ink:#FFFFFF; --accent-soft:rgba(32,38,210,.12); --cyan:#62E1FC; --band:#EEF0FE;
  --stop:#B4371F; --warn:#9A5B00; --ok:#1F7A4D; --code-bg:#F7F8FA; --pop:#FFFFFF; --shadow:0 10px 30px rgba(15,17,23,.12);
  --dots:rgba(15,17,23,.07);
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:var(--body);
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --top:56px; --hdr:var(--top);
  --measure:700px; --wide:700px; --nav:248px; --railw:212px; --gut:32px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0F14; --plate:#15161D; --panel:#1C1D26; --tint:#1C1F3E; --line:#252732; --line-2:#3A3D4C;
    --ink:#F2F2F6; --text:#C9CBD6; --muted:#9397A9;
    --accent:#8B90FF; --accent-ink:#0E0F14; --accent-soft:rgba(139,144,255,.18); --cyan:#62E1FC; --band:#1C1F3E;
    --stop:#FF8A70; --warn:#F2B24C; --ok:#5FD39A; --code-bg:#13141B; --pop:#1A1B24; --shadow:0 12px 32px rgba(0,0,0,.55);
    --dots:rgba(255,255,255,.06);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0F14; --plate:#15161D; --panel:#1C1D26; --tint:#1C1F3E; --line:#252732; --line-2:#3A3D4C;
  --ink:#F2F2F6; --text:#C9CBD6; --muted:#9397A9;
  --accent:#8B90FF; --accent-ink:#0E0F14; --accent-soft:rgba(139,144,255,.18); --cyan:#62E1FC; --band:#1C1F3E;
  --stop:#FF8A70; --warn:#F2B24C; --ok:#5FD39A; --code-bg:#13141B; --pop:#1A1B24; --shadow:0 12px 32px rgba(0,0,0,.55);
  --dots:rgba(255,255,255,.06);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:17px/1.68 var(--body);margin:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"kern"}
body.skim{--hdr:calc(var(--top) + 40px)}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
[id]{scroll-margin-top:calc(var(--hdr) + 24px)}
button{font:inherit;color:inherit}
::selection{background:var(--accent-soft)}
/* labels: small sans, sentence case. Mono is kept for code, IDs and numbers. */
.lab,.callout-label,.ch-part,.ch-no,.toc-part-label,.rail-label,.figno,.file-head,.card-no,.scene-label,.fm-k,.chip,.d-lab,.door-pick,.pn small,.kicker,.meta,.sa-total b,.tab,.tabs button,.copy,.showall,.fchip,.done-reset,.ps-no,.ps-when,.d-gate,.sa-score-band b,.tldr-label{
  font-family:var(--body);font-size:13px;line-height:1.3;letter-spacing:0;text-transform:none;font-weight:600}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:6px;height:var(--top);padding:0 var(--gut);max-width:none;margin:0;min-width:0}
.topbar .brand{display:inline-flex;align-items:center;gap:10px;font:600 15px/1 var(--body);color:var(--ink);text-decoration:none;letter-spacing:-.005em;white-space:nowrap;flex:none}
.topbar .brand::before{content:"";width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--accent) 0 50%,transparent 50%),var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent);flex:none}
.topbar .brand .b-short{display:none}
.tb-where{min-width:0;flex:0 1 auto;margin-left:18px;padding-left:18px;border-left:1px solid var(--line);font-size:14px;line-height:1.2;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-where b{font-weight:500;color:var(--ink)}
.tb-sp{flex:1 1 0;min-width:8px}
.topbar button{position:relative;background:transparent;border:1px solid transparent;border-radius:7px;padding:7px 11px;cursor:pointer;color:var(--text);white-space:nowrap;font:500 14px/1 var(--body);flex:none}
.topbar button:hover{background:var(--panel);color:var(--ink)}
/* skim: a plain button with a state dot; pressed = blue */
.tb-skim{padding-left:28px!important}
.tb-skim::before{content:"";position:absolute;left:11px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;border:1.5px solid var(--line-2);box-sizing:border-box;transition:background .15s,border-color .15s}
.topbar button[aria-pressed="true"]{color:var(--accent);background:var(--tint);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.topbar button[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
.tb-theme{padding-left:30px!important}
.tb-theme::before{content:"";position:absolute;left:10px;top:50%;width:13px;height:13px;margin-top:-7px;border-radius:50%;border:1.5px solid currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%);box-sizing:border-box}
.tb-nav{display:none}
.tb-nav::before{content:"";display:inline-block;width:14px;height:10px;margin-right:8px;vertical-align:0;background:linear-gradient(currentColor,currentColor) 0 0/100% 1.5px no-repeat,linear-gradient(currentColor,currentColor) 0 50%/100% 1.5px no-repeat,linear-gradient(currentColor,currentColor) 0 100%/100% 1.5px no-repeat}
/* page menu: copy this page as Markdown, view it, or open it in an agent */
.tb-page{position:relative;display:inline-flex;flex:none;border:1px solid var(--line);border-radius:7px;margin-right:4px}
.topbar .tb-page>button{border:0}
.topbar .tb-page .pm-copy{display:inline-flex;align-items:center;gap:7px;border-radius:6px 0 0 6px}
.topbar .tb-page .pm-tog{padding:7px 8px;border-left:1px solid var(--line);border-radius:0 6px 6px 0}
.topbar .tb-page .pm-copy.ok{color:var(--ok)}
.tb-page svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pm-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;width:280px;padding:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(15,17,23,.16)}
.topbar .pm-menu button{display:flex;align-items:flex-start;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:7px;text-align:left;white-space:normal;font:500 14px/1.25 var(--body);color:var(--ink)}
.pm-menu small{display:block;margin-top:3px;font:400 12.5px/1.3 var(--body);color:var(--muted)}
.pm-i{display:grid;place-items:center;flex:none;width:26px;height:26px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.pm-i svg.pm-brand{fill:currentColor;stroke:none;width:15px;height:15px}   /* brand marks from Simple Icons (CC0); OpenAI in ink */
.pm-i svg.pm-brand:not([style]){color:var(--ink)}
.pm-menu .pm-ext{width:11px;height:11px;margin-left:3px;vertical-align:-1px;color:var(--muted)}
.pm-menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
/* on a phone the button sits mid-bar, so the menu spans the screen under the bar instead of hanging off its left */
@media (max-width:640px){.tb-page .pm-label{display:none}.pm-menu{position:fixed;left:12px;right:12px;width:auto;top:calc(env(safe-area-inset-top,0px) + var(--top) + 4px)}}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent;pointer-events:none}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
/* skim mode announces itself as a second row of the sticky bar: it never sits on top of the text */
.skim-flag{display:none}
body.skim .skim-flag{display:flex;align-items:center;justify-content:flex-start;gap:14px;height:40px;padding:0 var(--gut);border-top:1px solid var(--line);background:var(--tint);color:var(--ink);font-size:14px;line-height:1.2}
.skim-flag b{font-weight:600;color:var(--accent)}
.skim-flag span{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.skim-flag button{background:var(--bg);border:1px solid var(--line-2);border-radius:7px;color:var(--ink);cursor:pointer;font:500 13px/1 var(--body);padding:6px 11px;flex:none}
.skim-flag button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- the page: the book | the text | on this page ---------- */
.shell{display:grid;grid-template-columns:var(--nav) minmax(0,var(--wide)) var(--railw);justify-content:start;column-gap:72px;padding-inline:var(--gut);max-width:none;margin:0}
nav.toc{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - var(--hdr));overflow:auto;padding:32px 12px 64px 0;margin-right:-12px;font-size:14.5px;line-height:1.35;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
main{min-width:0;padding:0 0 120px;container-type:inline-size}
.rail-col{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - var(--hdr));overflow:auto;padding:40px 0 48px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.rail-col:empty,.rail-col:has(> .rail[hidden]){display:none}
.shell:has(.rail-col > .rail[hidden]) > main{grid-column:2 / -1}
article.ch.off{display:none}

/* ---------- contents (left) ---------- */
.toc-tools{margin:0 0 4px}
#toc-q{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--plate);color:var(--text);font:14px/1.2 var(--body);padding:9px 11px}
#toc-q::placeholder{color:var(--muted)}
#toc-q:focus{border-color:var(--accent);outline:none;background:var(--bg);box-shadow:0 0 0 3px var(--accent-soft)}
#toc-hits{margin-top:10px}
#toc-hits a{display:block;text-decoration:none;color:var(--text);padding:7px 9px;border-radius:7px}
#toc-hits a:hover{background:var(--plate)}
#toc-hits .k{font:500 12px/1 var(--body);color:var(--muted);display:block;margin-bottom:4px}
#toc-hits .s{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px}
#toc-hits mark{background:var(--tint);color:var(--ink);padding:0 1px}
.toc-list{margin:14px 0 0}
details.toc-part{margin:0;border-top:1px solid var(--line)}
details.toc-part:last-child{border-bottom:1px solid var(--line)}
.toc-part > summary.toc-part-label{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;padding:10px 2px;margin:0;color:var(--ink);font-size:12.5px;user-select:none}
.toc-part > summary.toc-part-label::-webkit-details-marker{display:none}
.toc-part > summary.toc-part-label::marker{content:""}
.toc-part > summary.toc-part-label::before{content:"";flex:none;width:6px;height:6px;margin:0 4px 2px 2px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.toc-part[open] > summary.toc-part-label::before{transform:rotate(45deg);margin-bottom:4px}
.toc-part > summary.toc-part-label:hover{color:var(--accent)}
.toc-part > summary.toc-part-label:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.toc-part > summary .toc-g{flex:1 1 auto;min-width:0}
.toc-part > summary .toc-n{flex:none;font:500 11px/1 var(--mono);color:var(--muted)}
details.toc-part[open] > summary .toc-n{display:none}
.toc-part > ul{list-style:none;margin:0 0 12px 5px;padding:0;border-left:1px solid var(--line)}
.toc-part > ul > li{margin:0}
.toc-part > ul > li > a{display:flex;gap:8px;align-items:baseline;color:var(--muted);text-decoration:none;padding:5px 0 5px 14px;margin-left:-1px;border-left:1px solid transparent;position:relative}
.toc-part > ul > li > a:hover{color:var(--ink);border-left-color:var(--line-2)}
.toc-part > ul > li > a .toc-no{flex:none;width:20px;font:500 11.5px/1.5 var(--mono);color:var(--muted);opacity:.85}
.toc-part > ul > li > a .toc-no:empty{display:none}
.toc-part > ul > li > a .toc-t{flex:1 1 auto;min-width:0}
.toc-part > ul > li > a.on{color:var(--accent);border-left-color:var(--accent);font-weight:500}
.toc-part > ul > li > a.on .toc-no{color:var(--accent)}
.toc-ph{display:block;font:500 12px/1.4 var(--body);color:var(--muted)}
.toc-marks{flex:none;font:12px/1.5 var(--mono);color:var(--muted);white-space:nowrap}
.toc-marks .read{color:var(--ok)}
.toc-marks .cnt{margin-left:4px}
.toc-part > ul > li > a.path::before{content:"";position:absolute;left:-3px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--accent)}
/* a group of one page is a plain row in the same register as the group headers */
.toc-solo{border-top:1px solid var(--line)}
.toc-solo > a{display:flex;gap:8px;align-items:baseline;color:var(--ink);text-decoration:none;padding:10px 2px;font:500 12.5px/1.35 var(--mono);position:relative}
.toc-solo > a .toc-no:empty{display:none}
.toc-solo > a .toc-t{flex:1 1 auto;min-width:0}
.toc-solo > a:hover{color:var(--accent)}
.toc-solo > a.on{color:var(--accent)}
.toc-solo > a.path::before{content:"";position:absolute;left:-9px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--accent)}
/* a sub-label inside a group: principles, phases, after launch */
.toc-part > ul > li.toc-sub{font:500 10.5px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:12px 0 4px 14px}
.toc-part > ul > li.toc-sub:first-child{padding-top:6px}
/* the contents read in the body font: group names, sub-labels, badges and counts */
nav.toc .toc-part-label,nav.toc .toc-solo > a,nav.toc .toc-n,nav.toc .toc-no,nav.toc .ps-k,nav.toc .ps-prog,nav.toc .ps-dot{font-family:var(--body);font-variant-numeric:tabular-nums}
nav.toc .toc-part > summary.toc-part-label,nav.toc .toc-solo > a{font-size:14px;font-weight:600;letter-spacing:0;text-transform:none}
nav.toc .toc-part > ul > li.toc-sub{font:600 11.5px/1 var(--body);letter-spacing:.04em}
nav.toc .ps .ps-k{font:500 11px/1.2 var(--body);letter-spacing:.02em;text-transform:none}
/* groups as icon rows under two headings (Learn, Resources): no rules between rows, the count and a chevron on the right */
nav.toc .toc-sec{font:500 12.5px/1 var(--body);color:var(--muted);padding:20px 10px 8px}
nav.toc .toc-list > .toc-sec:first-child{padding-top:8px}
nav.toc details.toc-part,nav.toc details.toc-part:last-child,nav.toc .toc-solo{border:0}
nav.toc .toc-part > summary.toc-part-label,nav.toc .toc-solo > a{align-items:center;gap:10px;padding:8px 10px;margin:1px 0;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink)}
nav.toc .toc-part > summary.toc-part-label::before{display:none}
nav.toc .toc-part > summary.toc-part-label:hover,nav.toc .toc-solo > a:hover{background:var(--plate);color:var(--ink)}
nav.toc .toc-solo > a.on{background:var(--accent-soft);color:var(--accent)}
nav.toc .toc-i{flex:none;width:17px;height:17px;color:var(--muted)}
nav.toc .toc-solo > a.on .toc-i{color:var(--accent)}
nav.toc .toc-home .toc-i{color:inherit}
nav.toc .toc-chev{flex:none;width:15px;height:15px;margin-left:-6px;color:var(--muted);transition:transform .15s}
nav.toc details.toc-part[open] > summary .toc-chev{transform:rotate(90deg)}
nav.toc .toc-part > ul{margin:2px 0 10px 20px}
nav.toc .toc-home{margin:12px 0 4px;font-size:14px;font-weight:500;gap:10px;padding:8px 10px}
/* the source repository, at the foot of the contents */
nav.toc .toc-repo{position:sticky;bottom:0;z-index:1;display:flex;align-items:center;margin:16px 0 0;padding:10px 10px 12px;gap:10px;border-top:1px solid var(--line);border-radius:0;background:var(--bg);font-size:14px;font-weight:500;color:var(--muted)}
nav.toc .toc-repo:hover{color:var(--ink)}
nav.toc .toc-repo .toc-i{color:inherit}
nav.toc .toc-repo{text-decoration:none}
nav.toc .toc-stars{display:inline-flex;align-items:center;gap:4px;margin-left:auto;padding:1px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-variant-numeric:tabular-nums}
nav.toc .toc-stars[hidden]{display:none}
nav.toc .toc-star{width:12px;height:12px}
/* a row whose page is open can fold its "on this page" list away */
nav.toc .rail.folded{display:none}
nav.toc a[data-ch].on{cursor:pointer}
/* your path: the chosen reading path as a stepper at the top of the contents */
.toc-path{margin:16px 0 4px}
.toc-path:empty{display:none}
.ps-head{display:flex;align-items:baseline;gap:8px;margin:0 2px 6px}
.ps-head .toc-part-label{flex:1 1 auto;min-width:0;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-prog{flex:none;font:500 11px/1 var(--mono);color:var(--muted)}
.ps-list{list-style:none;margin:0;padding:0;counter-reset:ps}
.ps{position:relative;counter-increment:ps;margin:0}
.ps::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--line)}
.ps:first-child::before{top:50%}
.ps:last-child::before{bottom:50%}
.ps a{display:grid;grid-template-columns:17px minmax(0,1fr);column-gap:9px;align-items:center;padding:4px 0;text-decoration:none;color:var(--muted)}
.ps .ps-dot{grid-row:1 / -1;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--bg);position:relative;z-index:1;display:flex;align-items:center;justify-content:center;font:500 9.5px/1 var(--mono);color:var(--muted)}
.ps .ps-dot::before{content:counter(ps)}
.ps .ps-k{grid-column:2;font:500 10.5px/1.2 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ps .ps-t{grid-column:2;font-size:13.5px;line-height:1.3;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps a:hover .ps-t{color:var(--accent)}
.ps.done .ps-dot{border-color:var(--ok);color:var(--ok)}
.ps.done .ps-dot::before{content:"✓"}
.ps.done .ps-t{color:var(--muted)}
.ps.here .ps-dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ps.here .ps-t{color:var(--accent);font-weight:500}
.ps-foot{display:flex;gap:14px;align-items:baseline;margin:8px 0 0 26px;font-size:12.5px}
.ps-stop,.ps-change{background:none;border:0;padding:0;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
.ps-stop:hover,.ps-change:hover{color:var(--accent)}
body.filtering .toc-list,body.filtering .toc-path{display:none}
/* "on this page": its own right column on wide screens; under the current chapter in the contents when narrow */
.rail{font-size:13.5px;line-height:1.4}
.rail[hidden]{display:none}
.rail-label{display:block;color:var(--ink);margin:0 0 10px}
.rail-in:has(#rail-list:empty) > .rail-label{display:none}
.rail-in:has(#rail-list:empty) > .rail-left{margin-top:0}
.rail ul{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.rail li{margin:0}
.rail li a{display:block;color:var(--muted);text-decoration:none;padding:4px 0 4px 13px;margin-left:-1px;border-left:1px solid transparent}
.rail li.h3 a{padding-left:25px;font-size:13px}
.rail li a:hover{color:var(--ink)}
.rail li a.on{color:var(--accent);border-left-color:var(--accent)}
.rail-left{display:block;margin:16px 0 0;font:12.5px/1.3 var(--body);color:var(--muted)}
.rail-left:empty{display:none}
nav.toc .rail{margin:6px 0 10px 14px;padding:0}
nav.toc .rail .rail-label{display:none}
nav.toc .rail-left{margin:8px 0 0 13px}

/* ---------- home ---------- */
article.ch.home{padding-top:8px}
.cover{margin:48px 0 56px;padding:0}
.cover .kicker{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;color:var(--accent);font-size:14px;margin:0 0 18px}
.cover .kicker .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-weight:400;font-size:14px}
.cover .kicker .meta::before{content:"";width:1px;height:14px;background:var(--line-2);margin-right:2px;align-self:center}
.cover .kicker .meta span + span::before{content:"·";margin-right:14px;color:var(--line-2)}
.cover-t{min-width:0;max-width:var(--measure)}
.cover h1{font:600 clamp(36px,5.4cqw,52px)/1.08 var(--body);letter-spacing:-.022em;margin:0;color:var(--ink);text-wrap:balance}
.cover h1 span{display:block;margin-top:10px;font-size:.58em;line-height:1.25;letter-spacing:-.01em;color:var(--muted);font-weight:400}
.cover p.thesis{max-width:34em;font:400 19px/1.55 var(--body);color:var(--text);margin:22px 0 0}
.hero{margin:36px 0 0;padding:22px 26px 20px;border:1px solid var(--line);border-radius:12px;min-width:0;background:var(--bg);background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:16px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 36px}
.hero-k{grid-column:1 / -1;display:flex;justify-content:space-between;gap:12px;color:var(--ink);margin-bottom:12px;font:600 13px/1.2 var(--body)}
.hero-k span + span{color:var(--muted);font-weight:400}
.hero-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:end;margin-bottom:10px}
.hero-l{font-size:14px;line-height:1.3;color:var(--text)}
.hero-n{font:600 34px/1 var(--body);letter-spacing:-.02em;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.hero-bar{grid-column:1 / -1;height:8px;background:var(--panel);border-radius:999px;overflow:hidden}
.hero-bar i{display:block;height:100%;background:var(--line-2);border-radius:999px}
.hero-row.on .hero-l{color:var(--ink);font-weight:600}
.hero-row.on .hero-n{color:var(--accent)}
.hero-row.on .hero-bar i{background:var(--accent)}
.hero-cap{grid-column:1 / -1;margin:6px 0 0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.home-h{font:600 24px/1.25 var(--body);color:var(--ink);margin:0 0 6px;letter-spacing:-.012em}
.home-sec{margin:44px 0 0}.home-sec > p{margin:10px 0 0}.home-sec ul{margin:12px 0 0;padding-left:20px}.home-sec li{margin:6px 0}article.ch.home .home-sec + .home-h{margin-top:48px}
.home-sub{margin:0 0 22px;color:var(--muted);font-size:15.5px}
/* doors: three reading paths, one open at a time */
.doors{display:grid;gap:12px;margin-top:18px}
details.door{border:1px solid var(--line);border-radius:12px;background:var(--bg);position:relative;transition:border-color .15s}
details.door:hover{border-color:var(--line-2)}
details.door[open]{border-color:var(--line-2)}
details.door.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.door-sum{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 24px;align-items:center;padding:20px 22px}
.door-sum::-webkit-details-marker{display:none}
.door-sum::marker{content:""}
.door-sum:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
.door-h{grid-column:1;font:600 19px/1.3 var(--body);color:var(--ink);letter-spacing:-.01em}
.door-sum:hover .door-h{color:var(--accent)}
.door-who{margin:16px 0 0;font-size:15.5px;line-height:1.5;color:var(--text);max-width:40em}
.door-meta{grid-column:1;font-size:13.5px;color:var(--muted);margin-top:4px}
.door-chev{grid-column:2;grid-row:1 / span 2;width:30px;height:30px;border-radius:8px;position:relative;background:var(--plate)}
.door-chev::before{content:"";position:absolute;left:50%;top:44%;width:7px;height:7px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translate(-50%,-50%) rotate(45deg);transition:transform .15s}
details.door[open] .door-chev::before{top:56%;transform:translate(-50%,-50%) rotate(-135deg)}
.door-body{margin:0 22px;padding:4px 0 24px;border-top:1px solid var(--line)}
.door-act{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:18px 0 20px}
.door-pick{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:10px 15px;cursor:pointer;font-size:14px}
.door-pick:hover{filter:brightness(1.1)}
.door.picked .door-pick{background:var(--tint);color:var(--accent)}
.door-start{font-size:14.5px}
.door-start:empty{display:none}
article.ch .door-rec,.door-rec{font:600 13px/1.2 var(--body);color:var(--ink);margin:0 0 8px}
article.ch .door-steps + .door-rec{margin-top:26px}
.door .door-steps{list-style:none;margin:0;padding:0;counter-reset:ds}
.door-steps li{margin:0;max-width:none;border-top:1px solid var(--line);counter-increment:ds}
.door-steps a[href]{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:10px 0;text-decoration:none;color:var(--ink);font-size:15.5px;line-height:1.35}
.door-steps a[href]:hover{color:var(--accent)}
.door-steps .ds-no{font:500 12px/1 var(--mono);color:var(--muted)}
.door-steps .ds-no::before{content:counter(ds,decimal-leading-zero)}
.door-steps .ds-ch{display:block;font:400 13px/1.4 var(--body);color:var(--muted);margin-bottom:2px}
.door-steps .ds-card{color:var(--accent);font-weight:500}
.door-steps .ds-min{font:13px/1 var(--body);color:var(--muted);white-space:nowrap}
.door-note{margin:10px 0;font-size:14px;color:var(--muted);max-width:none}
.door-cards{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0}
.door-cards li{margin:0}
.home-links{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;font-size:15px}
.home-links a[href]{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;line-height:1.35}
.home-links a[href]:hover{color:var(--accent);border-color:var(--accent)}

/* Audio stays secondary to reading; the player appears only after a Listen click. */
.listen-cta{display:inline-flex;align-items:center;gap:8px;min-height:36px;font:500 14px/1.2 var(--body);color:var(--accent);text-decoration:none!important;white-space:nowrap}
.listen-cta:hover{text-decoration:underline!important;text-underline-offset:4px}
.listen-cta > span{font-size:11px}
.listen-cta small{font-size:12px;color:var(--muted);font-weight:400;margin-left:2px}
.cover-listen{margin:14px 0 0}
article.ch .door-listen{margin:12px 0;font-size:14px}
.door-act .listen-cta{padding:0 3px}
article.ch .listen-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0;margin:0;border-bottom:1px solid var(--line)}
article.ch .listen-row:first-of-type{border-top:1px solid var(--line)}
article.ch .listen-row h2{font-size:18px;line-height:1.3;margin:0 0 4px;border:0;padding:0}
article.ch .listen-row p{margin:0 0 5px;color:var(--muted);font-size:14px;line-height:1.4}
.listen-row-copy{min-width:0}
.listen-reading{font-size:13px;color:var(--muted)!important;text-decoration:none!important}
.listen-reading:hover{color:var(--accent)!important;text-decoration:underline!important}
article.ch .podcast-note{font-size:12.5px;line-height:1.5;color:var(--muted);margin:18px 0}
.listen-row noscript audio{width:100%}
.audio-dock[hidden]{display:none}
.audio-dock{position:fixed;z-index:50;bottom:16px;left:50%;transform:translateX(-50%);width:min(850px,calc(100% - 32px));padding:12px 16px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg);box-shadow:var(--shadow)}
.audio-dock-row{display:grid;grid-template-columns:minmax(120px,190px) 36px 32px minmax(70px,1fr) auto 56px 30px;align-items:center;gap:10px}
.audio-dock-info{min-width:0;font-size:13px;line-height:1.35}
.audio-dock-info strong{display:block;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.audio-dock-info a{font-size:11px;color:var(--muted);text-decoration:none}
.audio-dock button{border:0;background:transparent;cursor:pointer;border-radius:6px;height:32px;padding:0;color:var(--text);font:500 13px/1 var(--body)}
.audio-dock button:hover{background:var(--panel)}
.audio-dock .audio-toggle{height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.audio-toggle svg{width:16px;height:16px;vertical-align:middle;fill:currentColor}
.audio-toggle .audio-pause{display:none}
.audio-dock.is-playing .audio-play{display:none}
.audio-dock.is-playing .audio-pause{display:inline}
.audio-seek{width:100%;min-width:0;accent-color:var(--accent);cursor:pointer}
.audio-time{font:11px/1 var(--mono);color:var(--muted);white-space:nowrap}
.audio-speed{font:12px/1 var(--body);color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 1px}
.audio-dock .audio-close{font-size:21px;font-weight:400;color:var(--muted)}
.audio-dock .audio-error{font-size:12px;margin:8px 0 0;color:var(--stop)}
body.audio-open main{padding-bottom:190px}
.audio-dock :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:640px){
 .listen-row{flex-wrap:wrap}.listen-row-copy{flex:1 1 200px}.listen-row .listen-cta{min-height:32px}
 .audio-dock{bottom:calc(8px + env(safe-area-inset-bottom,0px));width:calc(100% - 16px);padding:10px 12px}
 .audio-dock-row{grid-template-columns:minmax(0,1fr) 32px 36px 52px 26px;gap:8px}
 .audio-dock-info{grid-column:1;grid-row:1}.audio-back{grid-column:2;grid-row:1}.audio-toggle{grid-column:3;grid-row:1}.audio-speed{grid-column:4;grid-row:1}.audio-close{grid-column:5;grid-row:1}
 .audio-seek{grid-column:1 / 4;grid-row:2}.audio-time{grid-column:4 / 6;grid-row:2;justify-self:end}
}
@media print{.audio-dock,.listen-cta{display:none!important}}

/* ---------- chapter header: breadcrumb, title, lede, one line of facts ---------- */
.ch-head{margin:44px 0 40px}
.ch-part{display:inline-block;color:var(--accent);font-size:14px;margin:0 8px 14px 0}
.ch-no{display:inline-block;color:var(--muted);font:500 13px/1.3 var(--mono);margin:0 0 14px}
.ch-head h1{font:600 clamp(30px,4.2cqw,40px)/1.15 var(--body);letter-spacing:-.02em;color:var(--ink);margin:0;text-wrap:balance}
.epigraph{font:400 19.5px/1.5 var(--body);color:var(--muted);margin:14px 0 0;max-width:36em;text-wrap:pretty}
.ch-meta{display:grid;gap:3px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;line-height:1.5;color:var(--text)}
.ch-meta > span{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px}
.ch-meta b{font-weight:500;color:var(--muted)}
/* the lifecycle track: a thin segmented bar, current phase in blue, phases behind you filled */
.phase-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) auto;gap:0 4px;margin-top:22px}
.phase-strip .ps{display:block;position:relative;padding:12px 6px 0 0;text-decoration:none;color:var(--muted);min-width:0}
.phase-strip .ps::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:2px;background:var(--line)}
.phase-strip .ps::after{display:none}
.phase-strip .ps.past::before{background:color-mix(in srgb,var(--accent) 40%,var(--line))}
.phase-strip .ps.on::before{background:var(--accent)}
.phase-strip a.ps:hover{color:var(--ink)}
.phase-strip a.ps:hover::before{background:var(--line-2)}
.phase-strip a.ps.on:hover::before{background:var(--accent)}
.phase-strip .ps-no{display:block;color:inherit;font-size:12px;font-weight:500}
.phase-strip .ps-name{display:block;font:400 12.5px/1.3 var(--body);color:inherit;margin-top:1px;text-wrap:balance}
.phase-strip .ps.on{color:var(--ink)}
.phase-strip .ps.on .ps-no{color:var(--accent)}
.phase-strip .ps.on .ps-name{font-weight:500}
.phase-strip .ps-loop{padding:9px 0 0 10px;color:var(--accent)}
.phase-strip .ps-loop::before{display:none}
.phase-strip .ps-loop .ps-no{display:inline;font-size:14px;margin-right:4px}
.phase-strip .ps-loop .ps-name{display:inline;font-size:13px}
.phase-strip .ps-loop:hover .ps-name{text-decoration:underline;text-underline-offset:3px}
.ch-foot{margin:80px 0 0;padding-top:0}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pn a{display:block;text-decoration:none;color:var(--ink);font:600 16px/1.35 var(--body);padding:14px 18px 16px;border:1px solid var(--line);border-radius:10px}
.pn a.next{text-align:right;grid-column:2}
.pn a:hover{color:var(--accent);border-color:var(--accent)}
.pn a small{display:block;color:var(--muted);font-weight:400;margin-bottom:4px}
.pn a.prev small::before{content:"← "}
.pn a.next small::after{content:" →"}
.pn a.next.on-path small,.pn a.prev.on-path small{color:var(--accent)}
.pn.pn-path{margin:32px 0 8px}
.pn.pn-path a{font-size:15px;padding-block:10px 12px}

/* ---------- prose ---------- */
h2,h3,h4{font-family:var(--body);color:var(--ink);letter-spacing:-.012em;text-wrap:balance}
article.ch h2{font-size:25px;line-height:1.25;font-weight:600;margin:64px 0 14px}
article.ch h3{font-size:19px;line-height:1.35;font-weight:600;margin:40px 0 8px;letter-spacing:-.006em}
article.ch h4{font-size:16.5px;line-height:1.4;font-weight:600;margin:28px 0 6px;letter-spacing:0}
p{margin:0 0 20px}
ul,ol{padding-left:22px;margin:0 0 20px}
li{margin:4px 0}
:where(article.ch) li{margin:8px 0}
:where(article.ch) li::marker{color:var(--muted)}
:where(article.ch) li > p{margin-bottom:8px}
li > ul,li > ol{margin:4px 0 0}
strong{color:var(--ink);font-weight:600}
:where(article.ch) :where(p,li,td,dd,figcaption,blockquote) a:not([class]){color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent);text-decoration-thickness:1px;text-underline-offset:3px}
:where(article.ch) :where(p,li,td,dd,figcaption,blockquote) a:not([class]):hover{text-decoration-color:var(--accent)}
p.read-more{margin:-4px 0 28px;font-size:15px;line-height:1.4}
.read-more .rm-k{font:500 13px/1 var(--body);color:var(--muted);margin-right:8px}
.read-more a[href]{color:var(--accent);text-decoration:none;font-weight:500}
.read-more a[href]:hover .rm-t{text-decoration:underline;text-underline-offset:3px}
a.card-ref{font:500 .88em/1.3 var(--body);color:var(--ink);background:var(--bg);border:1px dashed var(--line-2);border-radius:5px;padding:2px 7px 2px 6px;text-decoration:none;-webkit-box-decoration-break:clone;box-decoration-break:clone;white-space:normal}
a.card-ref::before{content:"";display:inline-block;width:7px;height:9px;border:1.5px solid var(--accent);border-radius:1.5px;margin-right:6px;vertical-align:-1px}
a.card-ref:hover{border-color:var(--accent);color:var(--accent)}
.door-cards a.card-ref{display:inline-block;font-size:14px;padding:6px 10px 6px 9px}
hr{border:0;border-top:1px solid var(--line);margin:44px 0}
code{font:.85em/1.4 var(--mono);background:var(--panel);padding:.1em .35em;border-radius:4px;color:var(--ink)}
blockquote{margin:0 0 20px;padding:0 0 0 18px;border-left:3px solid var(--line);color:var(--muted)}
sup{line-height:0}
/* in practice: a field story, ruled off from the method around it */
.scene{margin:8px 0 36px;padding:18px 0 20px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line);font-size:16.5px;line-height:1.7;color:var(--text)}
.scene > :last-child{margin-bottom:0}
.scene-label{color:var(--accent);margin-bottom:8px}
.scene p{max-width:none}

/* ---------- callouts: by weight, not by box ----------
   rule  = the method itself: a heavier statement with a blue bar
   stop  = a hazard: red bar and red label
   note  = an aside: grey bar
   done  = a checklist you tick
   card  = a sheet you print (dashed)            */
.callout{margin:0 0 28px}
.callout > :last-child{margin-bottom:0}
.callout-label{display:block;margin-bottom:6px}
.callout.rule{padding:2px 0 2px 20px;border-left:3px solid var(--accent);margin:32px 0}
.callout.rule p{font:500 20px/1.45 var(--body);letter-spacing:-.01em;color:var(--ink);margin:0}
.callout.rule .callout-label{color:var(--accent)}
.callout.brief{background:var(--plate);padding:18px 22px;border-radius:12px;font-size:15.5px;line-height:1.6}
.callout.brief .callout-label{color:var(--ink)}
.callout.brief ul{margin:0;padding-left:18px}
.callout.note{border-left:3px solid var(--line-2);padding:2px 0 2px 20px;font-size:15.5px;line-height:1.62}
.callout.note .callout-label{color:var(--muted)}
.callout.note .callout-title,.callout.stop .callout-title{display:block;font:600 16px/1.4 var(--body);color:var(--ink);margin:0 0 4px}
.callout.stop{border-left:3px solid var(--stop);padding:2px 0 2px 20px;font-size:15.5px;line-height:1.62}
.callout.stop .callout-label{color:var(--stop)}
.callout.stop .callout-label::before{content:"";display:inline-block;width:7px;height:7px;background:var(--stop);margin:0 8px 1px 1px;transform:rotate(45deg)}
.callout.done{border:1px solid var(--line);border-radius:12px;padding:0 20px 6px;margin:40px 0}
.callout-head{display:flex;align-items:center;gap:12px;margin:0 -20px 2px;padding:13px 20px;border-bottom:1px solid var(--line)}
.callout-head .callout-label{margin:0;color:var(--ink)}
.done-count{font:500 12.5px/1 var(--mono);color:var(--muted)}
.done-reset{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 4px;font-weight:500}
.done-reset:hover{color:var(--stop)}
.callout.done ul.task-list{list-style:none;padding:0;margin:0}
.callout.done li.task{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;margin:0;padding:10px 0;font-size:15px;line-height:1.5;max-width:none;border-bottom:1px solid var(--line)}
.callout.done li.task:last-child{border-bottom:0}
.callout.done li.task input{margin:4px 0 0;accent-color:var(--accent);width:16px;height:16px}
.callout.done li.task input:checked + label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.callout.done li.task label{cursor:pointer}
.callout.tooling{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;font-size:14.5px;line-height:1.55;gap:0 28px;padding:18px 22px 6px}
.callout.tooling .col > p:first-child strong{display:block;font:600 13px/1.2 var(--body);color:var(--accent);margin-bottom:8px}
.callout.tooling .col + .col > p:first-child strong{color:var(--muted)}
.callout.tooling ul{padding-left:18px}

/* ---------- tables ---------- */
.tw{margin:6px 0 32px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:14.5px;line-height:1.5;width:100%;font-variant-numeric:tabular-nums}
th{font:600 13px/1.35 var(--body);color:var(--ink);text-align:left;padding:10px 16px 10px 0;border-bottom:1px solid var(--line-2);vertical-align:bottom}
td{padding:11px 16px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:color-mix(in srgb,var(--plate) 80%,transparent)}
td:last-child,th:last-child{padding-right:0}
table.rowlabel td:first-child{color:var(--ink);font-weight:500}
th.num,td.num{text-align:right;white-space:nowrap}
table.kv th{display:none}
table.kv td:first-child{font:500 13px/1.6 var(--body);color:var(--muted);width:130px}
table.sticky th{position:static;background:var(--bg)}
td[data-label="Value"]{min-width:200px}

/* ---------- code: the file card ---------- */
figure.file{margin:6px 0 32px;border:1px solid var(--line);border-radius:10px;background:var(--code-bg);position:relative;overflow:hidden}
.file-head{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 14px;border-bottom:1px solid var(--line);color:var(--muted);flex-wrap:wrap;font-size:12.5px;font-weight:500;background:var(--bg)}
.file-head .fn{color:var(--ink);font:500 12.5px/1.3 var(--mono)}
.file-head .fn:empty{display:none}
.file-head .lang:empty{display:none}
.file-head .copy{margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--muted);font-size:12.5px}
.file-head .copy:hover{color:var(--ink);border-color:var(--line-2)}
.file-head .copy.ok{color:var(--ok);border-color:var(--ok)}
.tabs{display:inline-flex;gap:2px;padding:2px;border-radius:7px;background:var(--panel)}
.tabs button{background:transparent;border:0;border-radius:5px;padding:5px 10px;cursor:pointer;color:var(--muted);font-size:12.5px}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
figure.file pre{margin:0;padding:16px 18px;overflow-x:auto;font:13.5px/1.65 var(--mono);color:var(--text);background:transparent;tab-size:2}
figure.file pre code{background:none;border:0;padding:0;font-size:inherit;color:inherit}
figure.file pre.text{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono)}
figure.file.tall:not(.open) pre{max-height:480px;overflow-y:hidden}
figure.file.tall:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:41px;height:64px;background:linear-gradient(transparent,var(--code-bg));pointer-events:none}
figure.file .showall{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--bg);padding:12px;cursor:pointer;color:var(--accent);font-size:13px}
figure.file.open .showall{display:none}
pre .kw{color:var(--accent);font-weight:500}
pre .key{color:var(--ink);font-weight:500}
pre .cm{color:var(--muted)}
pre .st{color:var(--ok)}
pre .hd{color:var(--ink);font-weight:500}
pre .ph{color:var(--accent);background:var(--tint);border-radius:3px;padding:0 3px}
.template{margin:0 0 48px}
.tpl-title .tpl-no{font:500 13px/1 var(--mono);color:var(--accent);margin-right:10px}

/* ---------- the player: a play button on the poster, controls under the frame so burned-in captions stay visible ---------- */
.pl{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.pl video{display:block;width:100%;aspect-ratio:16/9;background:#fff;border:0!important;border-radius:0!important;cursor:pointer}
.pl-big{all:unset;position:absolute;left:0;right:0;top:0;aspect-ratio:16/9;display:grid;place-items:center;cursor:pointer;background:linear-gradient(to top,rgba(15,17,23,.18),rgba(15,17,23,0) 55%)}
.pl-big span{display:inline-flex;align-items:center;gap:10px;padding:11px 20px 11px 15px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 15px/1 var(--body);box-shadow:0 8px 24px rgba(32,38,210,.35);transition:transform .15s}
.pl-big:hover span{transform:scale(1.04)}
.pl-big:focus-visible span{outline:2px solid var(--ink);outline-offset:3px}
.pl-big svg{width:18px;height:18px;fill:currentColor}
.pl-big em{font-style:normal;font-weight:500;opacity:.85;font-variant-numeric:tabular-nums}
.pl.started .pl-big{display:none}
.pl-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line)}
.pl-btn{all:unset;flex:none;display:grid;place-items:center;min-width:32px;height:32px;border-radius:6px;color:var(--ink);cursor:pointer;font:600 12px/1 var(--body);font-variant-numeric:tabular-nums}
.pl-btn:hover{background:var(--line)}
.pl-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pl-btn svg{width:18px;height:18px;fill:currentColor}
.pl-btn .i-pause,.pl.playing .pl-btn .i-play{display:none}
.pl.playing .pl-btn .i-pause{display:block}
.pl-seek{flex:1;min-width:60px;height:4px;margin:0 6px;accent-color:var(--accent);cursor:pointer}
.pl-time{flex:none;font:500 12.5px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 4px}
.pl:fullscreen{display:flex;flex-direction:column;border:0;border-radius:0;background:#000}
.pl:fullscreen video{flex:1;min-height:0;height:auto;aspect-ratio:auto;object-fit:contain;background:#000}
.pl:fullscreen .pl-big{bottom:46px;aspect-ratio:auto}
.vid .pl + figcaption{margin-top:10px}
.vt-stage .pl{border:0;border-radius:0}
@media (max-width:480px){.pl-rate{display:none}.pl-time{font-size:12px}}
/* ---------- videos: one explainer under a chapter's summary, and the Toolkit grid ---------- */
.vid{margin:20px 0 28px;max-width:var(--measure)}
.vid video{display:block;width:100%;aspect-ratio:16/9;background:var(--ink);border-radius:10px;border:1px solid var(--line)}
.pl.nomedia .pl-bar{display:none}
.pl.nomedia .pl-big{cursor:default;opacity:.92}
.vid figcaption{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:10px 0 0;font-size:14px;color:var(--text);max-width:none}
.vid .vid-k{font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.vid figcaption b{font-weight:600;color:var(--ink)}
.vid .vid-d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.vid-tx{margin:8px 0 0;border-top:1px solid var(--line);padding-top:8px}
.vid-tx summary{cursor:pointer;font-size:13.5px;color:var(--muted);width:max-content;max-width:100%}
.vid-tx summary:hover{color:var(--ink)}
.vid-tx[open] summary{margin-bottom:8px}
.vid-tx p{font-size:14.5px;line-height:1.6;color:var(--text);margin:0 0 10px}
body.skim .vid-tx{display:none}
.vt{margin:18px 0 8px}
.vt-sum{margin:0 0 10px;font-size:13px;color:var(--muted);max-width:none}
.vt-stage{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.vt-player{display:block;width:100%;aspect-ratio:16/9;background:var(--ink)}
.vt-now{display:grid;gap:4px;padding:14px 16px 12px;border-top:1px solid var(--line)}
.vt-k{font:600 11px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.vt-title{font:600 19px/1.3 var(--display);color:var(--ink);letter-spacing:-.01em}
.vt-meta{font-size:13.5px;color:var(--muted)}
.vt-meta .vt-dur{font-variant-numeric:tabular-nums}
.vt-auto{display:inline-flex;align-items:center;gap:7px;margin-top:4px;font-size:13px;color:var(--text);cursor:pointer;width:max-content;max-width:100%}
.vt-auto input{accent-color:var(--accent);margin:0}
.vt-tx{margin-top:6px}
.vt-list{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.vt-list li{margin:0;min-width:0}
.vt-item{all:unset;box-sizing:border-box;display:grid;gap:3px;align-content:start;width:100%;height:100%;cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden;padding-bottom:10px}
.vt-item:hover{border-color:var(--line-2)}
.vt-item:hover .vt-t{color:var(--accent)}
.vt-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vt-item.is-on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.vt-item.is-on .vt-t{color:var(--accent)}
.vt-thumb{position:relative;display:block;aspect-ratio:16/9;background:var(--panel);border-bottom:1px solid var(--line)}
.vt-thumb img,.vt-noimg{display:block;width:100%;height:100%;object-fit:cover}
.vt-n{position:absolute;left:8px;top:8px;display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--ink);color:var(--bg);font:600 11.5px/1 var(--body)}
.vt-item.is-on .vt-n{background:var(--accent);color:var(--accent-ink)}
.vt-d{position:absolute;right:8px;bottom:8px;padding:2px 6px;border-radius:4px;background:rgba(15,17,23,.82);color:#fff;font:600 11px/1.3 var(--body);font-variant-numeric:tabular-nums}
.vt-t{padding:8px 11px 0;font:600 13.5px/1.35 var(--display);color:var(--ink)}
.vt-c{padding:0 11px;font-size:12px;line-height:1.35;color:var(--muted)}
@media (max-width:760px){.vt-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.vt-list{grid-template-columns:1fr}.vt-item{grid-template-columns:120px 1fr;grid-template-rows:auto 1fr;column-gap:10px;padding:0}.vt-thumb{grid-row:1/3;border-bottom:0;border-right:1px solid var(--line)}.vt-t{padding:9px 10px 0 0}.vt-c{padding:0 10px 9px 0}}
@media print{.vid,.vt{display:none}}
/* ---------- cards: a sheet you print and pin up (dashed cut line) ---------- */
section.card{border:1.5px dashed var(--line-2);border-radius:12px;padding:20px 18px 10px;margin:44px 0;background:var(--bg);position:relative}
.card-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.card-no{color:var(--accent)}
.card-no::after{content:" · one page";color:var(--muted);font-weight:400}
.card-title{font:600 19px/1.3 var(--body);color:var(--ink);letter-spacing:-.01em}
.card-src{margin-left:auto;font-size:13px;text-decoration:none}
.card-body{font-size:15px;line-height:1.58}
.card-body > :last-child{margin-bottom:0}
.card-body table{font-size:13.5px}
.cards-collection{display:grid;gap:0}

/* ---------- figures: a plain frame on the page colour, faint dot grid, caption beneath ---------- */
figure.fig{margin:44px 0}
figure.fig .fig-body,figure.fig .fig-phone{border:1px solid var(--line);border-radius:12px;background-color:var(--bg);background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:16px 16px;background-position:8px 8px;padding:clamp(10px,1.6cqw,16px)}
figure.fig .fig-body svg{width:100%;height:auto;display:block;margin:0 auto}
figure.fig .fig-body svg text{font-family:var(--body)}
svg .t{font-family:var(--body)} svg .m{font-family:var(--mono)} svg .d{font-family:var(--body)}
figure.fig figcaption{display:block;margin-top:12px;font-size:14px;line-height:1.5;color:var(--muted);max-width:var(--measure)}
.figno{display:inline;color:var(--ink);white-space:nowrap;margin-right:8px}
.fig-phone{display:none}
.fig-missing{border:1px dashed var(--stop);color:var(--stop);padding:24px;border-radius:12px;text-align:center}
.chart{max-width:var(--measure)}
section.card figure.fig{margin:16px 0 20px}
section.card figure.fig .fig-body{padding:14px}
.fig-body .d-swim .d-r,.fig-body .d-swim .d-side{background:var(--bg)}

/* ---------- failure-mode cards ---------- */
.fm-block{margin:0 0 44px}
.fm-filter{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:0 0 12px;position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));background:var(--bg);padding:12px 0;z-index:3;border-bottom:1px solid var(--line)}
.fm-q{flex:1 1 240px;border:1px solid var(--line);border-radius:8px;background:var(--plate);color:var(--text);font:14px/1.2 var(--body);padding:9px 11px}
.fm-q:focus{border-color:var(--accent);outline:none;background:var(--bg);box-shadow:0 0 0 3px var(--accent-soft)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip,.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:transparent;cursor:pointer;color:var(--text);font-size:12.5px;font-weight:500}
.chip{cursor:default;color:var(--muted)}
.fchip:hover{border-color:var(--line-2);color:var(--ink)}
.fchip.on{background:var(--tint);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.fm-count{font:12.5px/1 var(--body);color:var(--muted);margin-left:auto}
.fm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:0 32px}
.fm{border-bottom:1px solid var(--line);padding:16px 0 14px;font-size:14.5px;line-height:1.55}
.fm.hide{display:none}
.fm-head{display:flex;gap:12px;align-items:baseline;margin-bottom:8px}
.fm-no{font:500 12px/1.6 var(--mono);color:var(--accent)}
article.ch .fm-symptom,.fm-symptom{font:600 16px/1.35 var(--body);color:var(--ink);margin:0;letter-spacing:-.005em}
.fm-no:empty{display:none}
.fm-line{display:grid;grid-template-columns:60px 1fr;gap:10px;margin:5px 0}
.fm-k{color:var(--muted);padding-top:2px;font-size:12.5px;font-weight:500}
.fm-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.fm-ch{margin-left:auto}
.chip-dim{color:var(--muted);font-size:12.5px}

/* ---------- self-assessment ---------- */
.sa-src{display:none}
.sa{padding:0 0 18px;margin:0 0 30px}
.sa > .sa-sec:first-child{margin-top:14px}
.sa fieldset{border:0;margin:0;padding:20px 0;border-bottom:1px solid var(--line)}
.sa fieldset:last-of-type{border-bottom:0}
.sa legend{float:left;width:100%;font:600 16.5px/1.4 var(--body);color:var(--ink);padding:0;margin-bottom:12px;max-width:none}
.sa legend + *{clear:both}
.sa legend .sa-no{color:var(--accent);font-family:var(--mono);font-size:12.5px;margin-right:10px;font-weight:500}
.sa .sa-q{margin:0 0 12px;font-size:15px;max-width:none}
.sa .sa-sec{margin:28px 0 4px;padding-top:16px;border-top:1px solid var(--line-2);font-size:15px;max-width:none}
.sa-opts{display:grid;gap:6px}
.sa-opts label{display:grid;grid-template-columns:18px 22px 1fr;gap:8px;align-items:start;font-size:14.5px;line-height:1.45;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;max-width:none;background:var(--bg)}
.sa-opts label:hover{border-color:var(--line-2)}
.sa-opts label:has(input:checked){border-color:var(--accent);background:var(--tint)}
.sa-opts input{margin:3px 0 0;accent-color:var(--accent)}
.sa-opts b{font:500 12.5px/1.5 var(--mono);color:var(--muted)}
.sa-out{margin-top:10px;font-size:14.5px;color:var(--ink)}
.sa-out:empty{display:none}
.sa-flag{margin-top:8px;font-size:13px;color:var(--stop)}
.sa-read{font-size:13px;color:var(--muted);margin-top:8px}
.sa-score{position:sticky;bottom:12px;background:var(--pop);border:1px solid var(--line-2);border-radius:12px;padding:16px 20px;margin-top:18px;box-shadow:var(--shadow);font-size:14.5px}
.sa-total{font:600 28px/1 var(--body);color:var(--ink);letter-spacing:-.02em}
.sa-total b{color:var(--muted);margin-left:10px;font-weight:400}
.sa-score-band{margin-top:8px}
.sa-score-band b{color:var(--accent);display:block;margin-bottom:4px}
.sa-next ul{margin:6px 0 0;padding-left:18px}
.sa-tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sa-tools button{background:transparent;border:1px solid var(--line-2);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--text)}
.sa-tools button:hover{border-color:var(--accent);color:var(--accent)}
.sa-tools button.ok{border-color:var(--ok);color:var(--ok)}

/* ---------- diagram styles (HTML diagrams share these) ---------- */
.d{font-size:13.5px;line-height:1.4;color:var(--text)}
.d-lab{color:var(--muted);display:block;margin-bottom:6px}
.d-box{border:1px solid var(--line-2);border-radius:6px;padding:12px 14px;background:var(--bg);min-width:0}
.d-box.accent{border-color:var(--accent);background:var(--tint)}
.d-box.ink{border:1.5px solid var(--ink)}
.d-box h5{font:600 14.5px/1.3 var(--display);margin:0 0 6px;color:var(--ink);letter-spacing:-.01em}
.d-box ul{margin:0;padding-left:16px;font-size:13px}
.d-box li{margin:2px 0;max-width:none}
.d-box p{margin:0 0 6px;max-width:none;font-size:13px}
.d-mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
.d-gate{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.d-gate i{display:inline-block;width:10px;height:10px;background:var(--accent);transform:rotate(45deg)}
.d-arrow{color:var(--accent);font-size:20px;line-height:1;text-align:center}
/* phases */
.d-phases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:stretch}
.d-phase{border-top:3px solid var(--accent);padding:10px 8px 0;min-width:0;display:flex;flex-direction:column}
.d-phase .d-gatebox{margin-top:auto}
.d-phase .d-no{color:var(--accent);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.d-phase h5{font:600 15px/1.25 var(--display);margin:6px 0 2px;color:var(--ink)}
.d-phase .d-when{font:12px/1.4 var(--mono);color:var(--muted);margin-bottom:8px}
.d-phase p{font-size:12.5px;line-height:1.45;margin:0 0 8px;max-width:none}
.d-phase .d-gatebox{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12.5px;line-height:1.4;background:var(--panel)}
.d-phase .d-gatebox .d-gate{font-size:10.5px;margin-bottom:4px;display:flex}
.d-phase .d-gatebox{min-height:0}
/* every column shares the same rows, so the gate boxes (and the text above them) line up at one height */
@supports (grid-template-rows:subgrid){
  .d-phases{grid-template-rows:repeat(5,auto);row-gap:0}
  .d-phase{display:grid;grid-row:span 5;grid-template-rows:subgrid;align-content:start}
  .d-phase .d-gatebox{margin-top:0;align-self:stretch}
}
.d-golden{margin-top:14px;border-top:1px dashed var(--line-2);padding-top:10px}
.d-golden .d-lab{display:block;margin:0 0 8px}
.d-gs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.d-gs-c{position:relative;padding-top:12px}
.d-gs-c::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;border-radius:3px;background:var(--tint)}
.d-gs-c i{position:absolute;top:0;left:0;height:6px;border-radius:3px;background:var(--accent)}
.d-gs-c b{display:block;font:500 12px/1.35 var(--body);color:var(--text)}
.d-gs-note{margin:8px 0 0;font-size:12px;color:var(--muted);max-width:none}
/* lanes */
.d-lanes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.d-lanes .d-q{grid-column:1/-1;text-align:center;font:600 15px/1.3 var(--display);color:var(--ink);padding:10px 14px;border:1px solid var(--line-2);border-radius:6px}
.d-lane{border:1px solid var(--line-2);border-radius:6px;padding:14px 16px;display:grid;gap:10px;align-content:start}
.d-lane.gov{border-color:var(--accent)}
.d-lane .d-step{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:13px;line-height:1.45}
.d-lane .d-step > span:first-child{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.d-lane .d-ans{border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.d-lane .d-ans b{font:700 22px/1.1 var(--display);color:var(--ink);letter-spacing:-.02em;display:block}
.d-lanes .d-hint{grid-column:1/-1;text-align:center;font-size:12.5px;color:var(--muted)}
/* contract */
.d-contract{display:grid;grid-template-columns:1fr 150px 1fr;gap:14px;align-items:center}
.d-contract .d-col{display:grid;gap:8px}
.d-contract .d-item{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.4}
.d-contract .d-item b{display:block;color:var(--ink);font-weight:600}
.d-contract .d-mid{border:1.5px solid var(--ink);border-radius:8px;padding:16px 10px;text-align:center;position:relative;background:var(--bg)}
.d-contract .d-mid h5{font:600 16px/1.2 var(--display);margin:0;color:var(--ink)}
.d-contract .d-tag{position:absolute;top:-9px;right:10px;background:var(--bg);color:var(--muted);font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:3px}
.d-contract .d-flow{font-family:var(--mono);font-size:11px;color:var(--accent);text-align:center;letter-spacing:.06em;text-transform:uppercase}
.d-rules{grid-column:1/-1;margin-top:6px;font:12.5px/1.6 var(--mono);color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
/* swimlane */
.d-swim-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.d-swim{display:grid;grid-template-columns:150px repeat(9,minmax(72px,1fr));gap:2px;min-width:820px;font-size:12px;line-height:1.35}
.d-swim > div{padding:6px 3px;min-width:0}
.d-swim .d-h{font:500 10.5px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1.5px solid var(--ink);padding-bottom:6px;text-align:center}
.d-swim .d-h.g{position:relative}
.d-swim .d-h.g::before{content:attr(data-gate);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--accent)}
.d-swim .d-h.g::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;background:var(--accent);transform:translate(-50%,0) rotate(45deg)}
.d-swim .d-h.g .d-vline{position:absolute}
.d-swim .d-r{position:sticky;left:0;background:var(--bg);font-weight:500;color:var(--ink);border-right:1px solid var(--line);z-index:1}
.d-swim .d-r small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.d-swim .d-side{grid-column:1/-1;font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 6px 4px;position:sticky;left:0}
.d-swim .d-c{border-bottom:1px solid var(--line)}
.d-swim .d-c.g{border-left:1px dashed var(--accent-soft)}
.d-swim .p{display:inline-block;border-radius:4px;padding:3px 5px;font-size:11px;line-height:1.3;max-width:100%}
.d-swim .p.h{background:var(--tint);color:var(--ink)}
.d-swim .p.e{background:var(--accent);color:var(--accent-ink)}
.d-swim .p.s{border:1px solid var(--line-2);color:var(--text)}
.d-swim-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.d-swim-roles{display:none}
.d-swim-roles .d-box{margin-bottom:10px}
.d-swim-roles .d-strip{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;margin-top:6px}
.d-swim-roles .d-strip span{font:10px/1.3 var(--mono);text-align:center;padding:4px 0;border-radius:3px;background:var(--panel);color:var(--muted);min-width:0;overflow:hidden}
.d-swim-roles .d-strip span.on{background:var(--tint);color:var(--ink)}
.d-swim-roles .d-strip span.e{background:var(--accent);color:var(--accent-ink)}
/* five decisions */
.d-five{display:grid;grid-template-columns:repeat(4,minmax(0,1fr) auto) minmax(0,1fr);gap:8px;align-items:stretch}
.d-five .d-chip{border:1px solid var(--line-2);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.d-five .d-chip b{font:700 22px/1 var(--display);color:var(--accent);letter-spacing:-.02em}
.d-five .d-chip span{font:600 13px/1.3 var(--body);color:var(--ink)}
.d-five .d-chip em{font:400 12px/1.35 var(--body);font-style:normal;color:var(--muted)}
.d-five .d-op{align-self:center;font:500 18px/1 var(--display);color:var(--muted)}
.d-five .d-res{grid-column:1/-1;border:1.5px solid var(--ink);border-radius:6px;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.d-five .d-res b{font:700 24px/1 var(--display);color:var(--ink);letter-spacing:-.02em}
.d-five .d-res span{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.d-five{grid-template-columns:1fr}.d-five .d-op{justify-self:center;font-size:14px}}
/* A1 before/after */
.d-a1{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.d-a1 .d-box h5{margin-bottom:2px}
.d-a1 .d-big{font:700 34px/1 var(--display);letter-spacing:-.03em;margin:6px 0 10px;color:var(--ink)}
.d-a1 .before .d-big{color:var(--stop)}
.d-a1 .after .d-big{color:var(--accent)}
.d-a1 dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:12.5px}
.d-a1 dt{color:var(--muted)} .d-a1 dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}
.d-a1 .d-why{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
/* closure */
.d-closure{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;align-items:start}
.d-closure .d-parts{display:grid;gap:8px}
.d-closure .d-part{border-left:3px solid var(--accent);padding:4px 10px;font-size:12.5px;line-height:1.4}
.d-closure .d-part b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.d-closure .d-part span{color:var(--muted)}
.d-closure pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font:11.5px/1.6 var(--mono);overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.d-closure pre mark{background:var(--tint);color:var(--ink);border-radius:2px;padding:0 2px;position:relative}
.d-closure pre mark::after{content:attr(data-p);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-left:6px;vertical-align:2px}
/* ladder phone bars */
.d-bars{display:grid;gap:10px}
.d-bar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:12.5px}
.d-bar-l{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px}
.d-bar-l .m{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.d-bar-t{height:14px;background:var(--panel);border-radius:3px;overflow:hidden}
.d-bar-t i{display:block;height:100%;background:var(--accent)}
.d-bar.hatched .d-bar-t i{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 4px,transparent 4px 8px);border:1px dashed var(--muted)}
.d-bar-v{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.d-bar:not(.last) .d-bar-t i{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
/* what did not help: dumbbells */
.d-dumb{display:grid;gap:6px}
.d-dumb .d-row{display:grid;grid-template-columns:200px 1fr 170px;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.35}
.d-dumb .d-l{color:var(--ink)} .d-dumb .d-l .m{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.d-dumb .d-t{position:relative;height:18px;background:linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/25% 100% repeat-x,var(--panel);border-radius:3px}
.d-dumb .d-seg{position:absolute;top:7px;height:4px;background:var(--line-2);border-radius:2px}
.d-dumb .d-b,.d-dumb .d-a{position:absolute;top:4px;width:10px;height:10px;border-radius:50%;margin-left:-5px;background:var(--muted)}
.d-dumb .d-a{background:var(--accent)} .d-dumb .d-a.worse{background:var(--stop)}
.d-dumb .d-v{font-size:11px;color:var(--muted)}
.d-dumb .d-legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);padding-top:6px}
.d-dumb .d-legend span{display:inline-flex;align-items:center;gap:6px}
@media (max-width:640px){.d-dumb .d-row{grid-template-columns:1fr;gap:6px}}
/* stacked tree (phone variants) */
.d-tree ol{list-style:none;padding:0;margin:0}
.d-tree li{border-left:2px solid var(--line-2);padding:4px 0 4px 12px;margin:6px 0;max-width:none}
.d-tree li.q{font-weight:600;color:var(--ink);border-left-color:var(--accent)}
.d-tree li.q li{font-weight:400;color:var(--text)}
.d-tree li.leaf{border-left-color:var(--ok)}
.d-tree li.stop{border-left-color:var(--stop)}
.d-tree .yn{font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.d-tree li ol{margin-left:4px}
/* ontology phone */
.d-ent{display:grid;gap:8px}
.d-ent .d-box{padding:8px 12px}

.d-ent .d-edge{font-size:12.5px;padding:4px 0 4px 12px;border-left:2px solid var(--accent);margin:2px 0}
.d-ent .d-flag{font-size:12.5px;padding:6px 10px;border:1px dashed var(--stop);border-radius:6px;color:var(--text)}
.d-ent .d-flag b{color:var(--stop)}

/* ---------- per-diagram styles (diagrams/*.css, injected by build.py) ---------- */

/* ---------- one left edge: text takes the measure, figures/code/wide tables take the full column ----------
   Everything starts at the same x, right after the contents, so the eye always has an anchor. */
article.ch > :not(section.level2):not(section.level3),
article.ch :is(section.level2,section.level3,section.level4,section.template) > :not(section.level2):not(section.level3):not(section.level4):not(section.template){
  max-width:min(var(--w,var(--measure)),100%);margin-left:0!important;margin-right:0!important}
figure.fig,figure.file,.tw.wide,.fm-block,.template-file,.cover,.hero{--w:var(--wide)}
.doors,.home-links,.home-h,.home-sub,article.ch.home > .resume{--w:var(--wide)}
section.card{--w:760px}
.component:has(.fm-block){--w:var(--wide)}
.ch-head{--w:760px}

/* ---------- in one minute + skim mode ---------- */
.tldr{margin:0 0 36px;border:1px solid var(--line);border-radius:12px;padding:16px 22px 18px;background:var(--plate)}
.tldr-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}

.tldr-skim:hover,.tldr-full:hover{border-color:var(--accent);color:var(--accent)}
.tldr-skim[aria-pressed="true"]{background:var(--tint);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.tldr ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tldr li{margin:0;font-size:15.5px;line-height:1.6;color:var(--text)}
.tldr li strong{color:var(--ink)}
.tldr-full{margin-top:16px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tldr-full:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.1)}
body.skim article.ch:has(> .tldr) > :not(.ch-head):not(.callout.rule):not(.tldr):not(figure.vid):not(section.level2):not(.ch-foot):not(.pn-path){display:none!important}

  html{scroll-behavior:auto}

  .shell{display:block;padding:0;max-width:none}

  article.ch,article.ch.off{display:block!important;break-before:page}
  article.ch.home{break-before:auto}
  article.ch > :not(section.level2):not(section.level3),article.ch :is(section.level2,section.level3,section.level4,section.template) > *{max-width:none!important}
  .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact;background-image:none}

  section.card:not(.card-inline) figure.fig .fig-body svg{max-height:95mm;width:auto;max-width:100%;margin:0 auto}
  h2,h3{break-after:avoid}

  figure.fig,figure.file,table,.callout,.fm,.scene{break-inside:avoid}
  figure.file.tall:not(.open) pre{max-height:none;overflow:visible}

  figure.file pre[role="tabpanel"]::before{content:attr(data-tabname);display:block;font:600 9pt var(--body);color:#555;margin-bottom:6px}

/* ---------- click a figure to see it larger ---------- */
figure.fig .fig-body{cursor:zoom-in;position:relative}
figure.fig .fig-body::after{content:"Click to enlarge";position:absolute;right:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;opacity:0;transition:opacity .15s;pointer-events:none}
figure.fig .fig-body:hover::after{opacity:1}
section.card figure.fig .fig-body,figure.fig[data-diagram="tasks"] .fig-body,figure.fig[data-diagram="lifecycle"] .fig-body{cursor:default} section.card figure.fig .fig-body::after,figure.fig[data-diagram="tasks"] .fig-body::after,figure.fig[data-diagram="lifecycle"] .fig-body::after{display:none}
.zoom{position:fixed;inset:0;z-index:70;background:rgba(15,16,22,.55);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.zoom-in{background:var(--bg);border-radius:12px;box-shadow:var(--shadow);padding:24px;width:min(1240px,100%);max-height:calc(100vh - 48px);overflow:auto;cursor:auto}
.zoom-in svg{width:100%;height:auto;display:block}
.zoom-cap{margin:14px 0 0;font-size:14px;color:var(--muted)}
.zoom-x{float:right;margin:-8px -8px 8px 8px;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--text);font:inherit;font-size:13px}
@media (max-width:900px){figure.fig .fig-body{cursor:default} figure.fig .fig-body::after{display:none}}
@media print{.zoom{display:none!important}}

/* ---------- markdown templates render as a document; Copy still copies the markdown ---------- */
figure.file.has-md pre{display:none!important}
figure.file .md-render{padding:14px 18px 6px;font-size:14.5px;line-height:1.55;color:var(--text);background:var(--bg)}
figure.file .md-render > :first-child{margin-top:0}
figure.file .md-render h1,figure.file .md-render h2,figure.file .md-render h3{font-size:15.5px;margin:16px 0 6px;border:0;padding:0}
figure.file .md-render p,figure.file .md-render ul,figure.file .md-render ol{margin:0 0 10px}
figure.file .md-render li{margin:2px 0}
figure.file .md-render table{width:100%;border-collapse:collapse;font-size:13.5px;margin:4px 0 14px;display:block;overflow-x:auto}
figure.file .md-render th{text-align:left;font-weight:600;color:var(--ink);border-bottom:1px solid var(--ink);padding:6px 10px 6px 0;vertical-align:bottom}
figure.file .md-render td{border-bottom:1px solid var(--line);padding:6px 10px 6px 0;vertical-align:top}
figure.file .md-render code{font-size:12.5px}
figure.file .md-render input[type=checkbox]{margin-right:6px}

a.card-ref{max-width:100%;white-space:normal}
figure.file pre.yaml,figure.file pre.text{white-space:pre-wrap;overflow-wrap:anywhere}
section.card figure.fig .fig-body{padding:8px}
.zoom-body svg{max-height:calc(100vh - 170px);width:auto;max-width:100%;margin:0 auto}

/* ---------- phones: the top bar always fits, and nothing can widen the page sideways ---------- */
html{overflow-x:clip}
body{overflow-x:clip}
@media (max-width:480px){
  .topbar{gap:4px}
  .topbar .brand{min-width:0;flex:0 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .topbar .tb-sp{min-width:4px}
  .tb-theme{font-size:0!important;width:34px;padding:0!important;position:relative}
  .tb-theme::before{left:50%!important;margin-left:-7px}
}
@media (max-width:340px){ .topbar .brand .b-short{display:none} }
