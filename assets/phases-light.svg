<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Phase 0, then Phases 1-4, each ending at a gate">
<rect width="1200" height="190" rx="14" fill="#FFFFFF" stroke="#E1E1EC"/>
<rect x="24" y="24" width="222" height="104" rx="10" fill="#E9E9FA"/>
<text x="42" y="54" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#2026D2">PHASE 0</text>
<text x="42" y="88" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#141517">Before the clock</text>
<path d="M42 150 l10 -10 l10 10 l-10 10 z" fill="#2026D2"/>
<text x="64" y="155" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#3A3B4F">The checklist signed</text>
<path d="M247 76 l10 0" stroke="#6E6E88" stroke-width="2"/>
