<text x="744" y="54" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#2026D2">PHASE 3</text>
<text x="744" y="88" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#141517">Hill-climb from traces</text>
<path d="M744 150 l10 -10 l10 10 l-10 10 z" fill="#2026D2"/>
<text x="766" y="155" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#3A3B4F">Score clears the bar</text>
