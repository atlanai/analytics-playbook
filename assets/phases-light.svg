<text x="276" y="54" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#2026D2">PHASE 1</text>
<text x="276" y="88" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#141517">Build the golden set</text>
<path d="M276 150 l10 -10 l10 10 l-10 10 z" fill="#2026D2"/>
<text x="298" y="155" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#3A3B4F">20+ sealed, baseline run</text>
<path d="M481 76 l10 0" stroke="#6E6E88" stroke-width="2"/>
