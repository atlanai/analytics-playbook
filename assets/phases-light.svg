<text x="510" y="54" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#2026D2">PHASE 2</text>
<text x="510" y="88" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#141517">Generate metrics</text>
<path d="M510 150 l10 -10 l10 10 l-10 10 z" fill="#2026D2"/>
<text x="532" y="155" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#3A3B4F">Metrics, scored</text>
<path d="M715 76 l10 0" stroke="#6E6E88" stroke-width="2"/>
