<text x="276" y="88" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#F2F2F7">Build the golden set</text>
<path d="M276 150 l10 -10 l10 10 l-10 10 z" fill="#8B90FF"/>
<text x="298" y="155" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#C9CAD8">20+ sealed, baseline run</text>
