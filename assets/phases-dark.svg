<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Phase 0, then Phases 1-4, each ending at a gate">
<rect width="1200" height="190" rx="14" fill="#0D1117" stroke="#2A2C3E"/>
