<text x="42" y="88" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#F2F2F7">Before the clock</text>
<path d="M42 150 l10 -10 l10 10 l-10 10 z" fill="#8B90FF"/>
<text x="64" y="155" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#C9CAD8">The checklist signed</text>
